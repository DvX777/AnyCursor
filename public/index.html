<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AnyCursor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 29 10.5 16 18 3 10.5Z' fill='%234d8dff'/%3E%3Cpath d='M3 10.5 16 18v11L3 21.5Z' fill='%23202733'/%3E%3Cpath d='M29 10.5 16 18v11l13-7.5Z' fill='%232a6bf0'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0b;
    --rail: #08080a;
    --line: #1d1d22;
    --line-2: #2a2a32;
    --text: #ededf0;
    --text-2: #a6a6b0;
    --muted: #75757f;
    --accent: #4d8dff;
    --accent-2: #3d7df2;
    --ok: #3ecf8e;
    --warn: #dcb264;
    --bad: #ef6a63;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; grid-template-columns: 218px minmax(0, 1fr);
    background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: #2b4f8f; }
  a { color: var(--accent); text-decoration: none; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px; }
  .muted { color: var(--muted); }

  /* ---------------- rail ---------------- */
  .rail {
    position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
    padding: 12px 10px 10px; border-right: 1px solid var(--line); background: var(--rail);
  }
  .brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 16px; }
  .brand img { width: 24px; height: 24px; display: block; }
  .brand .name { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
  .brand .ver { font-size: 10.5px; color: var(--muted); }
  .group { margin-top: 16px; }
  .group-label {
    padding: 0 8px 5px; font-size: 10px; font-weight: 550; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted);
  }
  .nav-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 6px 8px; margin-bottom: 1px; border: 0; border-radius: 6px;
    background: transparent; color: var(--text-2);
    font: inherit; font-size: 12.5px; text-align: left; cursor: pointer;
  }
  .nav-item:hover { background: #121216; color: var(--text); }
  .nav-item.active { background: #17171c; color: var(--text); }
  .nav-item svg { width: 14px; height: 14px; flex: none; opacity: .65; }
  .nav-item.active svg { opacity: .9; }
  .nav-item .n { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rail-foot { margin-top: auto; padding: 10px 8px 4px; border-top: 1px solid var(--line); }
  .rail-foot .state { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); }
  .rail-foot .addr { margin-top: 5px; color: var(--muted); }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  .dot.warn { background: var(--warn); }

  /* ---------------- page ---------------- */
  .shell { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
  .page-head {
    display: flex; align-items: flex-start; gap: 20px;
    padding: 26px 40px 20px; border-bottom: 1px solid var(--line);
  }
  .page-head .titles { min-width: 0; }
  .page-head h1 {
    margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.015em;
  }
  .page-head .sub { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
  .page-head .actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .back {
    display: inline-flex; align-items: center; gap: 5px; margin: 0 0 10px -2px; padding: 2px 4px;
    border: 0; border-radius: 5px; background: none; color: var(--muted);
    font: inherit; font-size: 12px; cursor: pointer;
  }
  .back:hover { color: var(--text); background: #131317; }

  .body { flex: 1; width: 100%; max-width: 920px; padding: 0 40px 40px; }
  .section { padding: 22px 0 6px; border-bottom: 1px solid var(--line); }
  .section:last-child { border-bottom: 0; }
  .section-head { margin-bottom: 6px; }
  .section h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: -.005em; }
  .section .desc { margin: 3px 0 0; font-size: 12px; color: var(--muted); max-width: 560px; }

  .form-row {
    display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px;
    padding: 11px 0; align-items: center;
  }
  .form-row > .lbl { padding-top: 0; }
  .form-row .lbl .name { font-size: 12.5px; color: var(--text-2); }
  .form-row .lbl .desc { margin-top: 3px; font-size: 11.5px; line-height: 1.45; color: var(--muted); }
  .ctrl { max-width: 440px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .ctrl.wide { max-width: 440px; }
  .hint { font-size: 11.5px; color: var(--muted); line-height: 1.45; }

  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%; height: 32px; padding: 0 10px; border-radius: 6px;
    border: 1px solid var(--line-2); background: #0d0d10; color: var(--text);
    font: inherit; font-size: 12.5px; transition: border-color .12s, box-shadow .12s;
  }
  textarea { height: auto; padding: 10px 12px; }
  select {
    appearance: none; padding-right: 26px;
    background-image: linear-gradient(45deg, transparent 50%, #7c7c88 50%), linear-gradient(135deg, #7c7c88 50%, transparent 50%);
    background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
    background-size: 4px 4px, 4px 4px; background-repeat: no-repeat;
  }
  input:hover, select:hover, textarea:hover { border-color: #3a3a44; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(77, 141, 255, .16);
  }
  input::placeholder, textarea::placeholder { color: #55555f; }
  input[type=checkbox] { height: 13px; width: 13px; accent-color: var(--accent); margin: 0; flex: none; }
  .check { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); cursor: pointer; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 30px; padding: 0 12px; border-radius: 6px;
    border: 1px solid var(--line-2); background: #16161a; color: var(--text);
    font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn:hover { background: #1c1c21; border-color: #3a3a44; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #5c97ff; border-color: #5c97ff; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
  .btn.ghost:hover { background: #16161a; color: var(--text); }
  .btn.danger { background: transparent; color: var(--text-2); }
  .btn.danger:hover { color: var(--bad); border-color: #52302f; background: #1a1213; }
  .btn:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid rgba(77, 141, 255, .5); outline-offset: 1px; }

  /* ---------------- table ---------------- */
  .table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .table th {
    padding: 8px 10px; text-align: left; font-size: 10.5px; font-weight: 550;
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  .table td { padding: 11px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .table tr:last-child td { border-bottom: 0; }
  .table tbody tr { cursor: pointer; }
  .table tbody tr:hover td { background: #101013; }
  .table td:first-child, .table th:first-child { padding-left: 2px; }
  .table td:last-child, .table th:last-child { padding-right: 2px; }
  .cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .cell .name { font-size: 12.5px; color: var(--text); }
  .cell .meta { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .cell .grow { min-width: 0; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
  .avatar {
    width: 26px; height: 26px; border-radius: 6px; flex: none; display: grid; place-items: center;
    background: #17171d; border: 1px solid var(--line-2);
    font-size: 11px; font-weight: 600; color: #b9c6dd; text-transform: uppercase;
  }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); }
  .tag {
    display: inline-flex; align-items: center; height: 19px; padding: 0 6px; border-radius: 4px;
    border: 1px solid var(--line-2); background: #121216; font-size: 10.5px; color: var(--text-2);
  }
  .right { text-align: right; }
  .chev { width: 13px; height: 13px; color: #4a4a55; }

  /* ---------------- metrics strip ---------------- */
  .metrics { display: flex; flex-wrap: wrap; padding: 18px 0 20px; border-bottom: 1px solid var(--line); }
  .metric { padding-right: 28px; margin-right: 28px; border-right: 1px solid var(--line); }
  .metric:last-child { border-right: 0; margin-right: 0; padding-right: 0; }
  .metric .k { font-size: 10.5px; font-weight: 550; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .metric .v { margin-top: 5px; font-size: 15px; font-variant-numeric: tabular-nums; }
  .metric .v.small { font-size: 12.5px; color: var(--text-2); }

  /* ---------------- save bar ---------------- */
  .savebar {
    position: sticky; bottom: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 11px 40px; border-top: 1px solid var(--line);
    background: rgba(10, 10, 11, .9); backdrop-filter: blur(10px);
  }
  .savebar .spacer { flex: 1; }
  .dirty { font-size: 11.5px; color: var(--warn); }
  .kbd {
    padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-2);
    color: var(--muted); font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }

  .empty { padding: 34px 0 40px; color: var(--muted); font-size: 12.5px; }

  /* ---------------- toast ---------------- */
  .toast {
    position: fixed; right: 22px; bottom: 70px; z-index: 90; max-width: 380px;
    padding: 10px 12px; border-radius: 7px; border: 1px solid var(--line-2);
    background: #15151a; font-size: 12px; color: var(--text);
    box-shadow: 0 16px 40px -16px rgba(0, 0, 0, .9);
    opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .15s, transform .15s;
  }
  .toast.show { opacity: 1; transform: none; pointer-events: auto; }
  .toast.good { border-color: #24523f; }
  .toast.bad { border-color: #55302e; }
  .toast .t { font-weight: 600; margin-bottom: 2px; }
  .toast .b { color: var(--text-2); word-break: break-word; }

  * { scrollbar-width: thin; scrollbar-color: #2c2c34 transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2c2c34; border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a45; background-clip: content-box; }

  .warnings { margin: 10px 0 0; padding-left: 16px; color: var(--warn); font-size: 12px; }
  .warnings li + li { margin-top: 3px; }

  /* ---------------- responsive ---------------- */
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; }
    .rail {
      position: static; height: auto; flex-direction: row; align-items: center; flex-wrap: wrap;
      padding: 9px 14px; border-right: 0; border-bottom: 1px solid var(--line);
    }
    .brand { padding: 0 12px 0 2px; }
    .group { margin: 0; display: flex; flex-wrap: wrap; }
    .group + .group { margin-left: 10px; padding-left: 12px; border-left: 1px solid var(--line); }
    .group-label, .rail-foot { display: none; }
    .nav-item { width: auto; padding: 5px 9px; }
    .page-head { padding: 18px 20px 14px; }
    .body { padding: 0 20px 32px; }
    .savebar { padding: 10px 20px; }
  }
  @media (max-width: 720px) {
    .form-row { grid-template-columns: 1fr; gap: 6px; padding: 10px 0 14px; }
    .form-row > .lbl { padding-top: 0; }
    .ctrl, .ctrl.wide { max-width: none; }
    .table .hide-sm, .hide-sm { display: none; }
    .table td.muted { white-space: nowrap; }
    .page-head { flex-wrap: wrap; }
    .page-head .actions { margin-left: 0; }
  }
  @media (max-width: 560px) {
    .group + .group { border-left: 0; margin-left: 0; padding-left: 0; }
    .page-head { padding: 16px 16px 14px; }
    .body { padding: 0 16px 28px; }
    .savebar { padding: 10px 16px; gap: 8px; }
  }
</style>
</head>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const attr = (s) => esc(s).replace(/`/g, '&#96;');
  const fmtUptime = (ms) => {
    const s = Math.floor(ms / 1000);
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ${s % 60}s`;
    return `${Math.floor(m / 60)}h ${m % 60}m`;
  };

  const TYPES = ['openai-compatible', 'anthropic', 'google', 'azure-openai', 'bedrock'];
  const TITLES = {
    overview: ['Overview', 'Gateway status and what Cursor can see right now.'],
    providers: ['Providers', 'Endpoints and credentials used to reach your models.'],
    models: ['Models', "Every model Cursor can pick, and where its requests go."],
    gateway: ['Gateway', 'Listener, upstream and fallback behaviour.'],
    raw: ['Raw JSON', 'Edit the configuration file directly.'],
  };

  const route = { view: 'overview', provider: null, model: null };
  let CFG = null;
  let META = null;
  let STATUS = null;
  let dirty = false;
  let toastTimer = null;

  // ---------- shell ----------
  function toast(html, kind, title) {
    const el = $('toast');
    el.innerHTML = (title ? `<div class="t">${title}</div>` : '') + `<div class="b">${html}</div>`;
    el.className = 'toast show ' + (kind || '');
    clearTimeout(toastTimer);
    if (kind === 'good') toastTimer = setTimeout(() => { el.className = 'toast'; }, 3200);
  }

  function markDirty(value) {
    dirty = value !== false;
    $('dirty').textContent = dirty ? 'Unsaved changes' : '';
  }

  function go(view, opts) {
    route.view = view;
    route.provider = null;
    route.model = null;
    if (opts) Object.assign(route, opts);
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function render() {
    document.querySelectorAll('.nav-item').forEach((b) => {
      b.classList.toggle('active', b.dataset.view === route.view);
    });
    renderHead();
    renderBody();
    renderCounts();
  }

  function renderCounts() {
    if (!CFG) return;
    $('nav-providers').textContent = Object.keys(CFG.providers || {}).length || '';
    $('nav-models').textContent = (CFG.models || []).length || '';
  }

  function renderHead() {
    const head = $('page-head');
    if (route.view === 'providers' && route.provider) {
      const p = CFG.providers[route.provider] || {};
      head.innerHTML = `<div class="titles">
        <button class="back" onclick="go('providers')">← Providers</button>
        <h1>${esc(route.provider)}</h1>
        <p class="sub">${esc(p.type || 'unset')}${p.hasApiKey || p.hasSecretAccessKey ? ' · credentials stored' : p.credential ? ` · credential ${esc(p.credential)}` : ' · no credentials'}</p>
      </div>
      <div class="actions"><button class="btn danger" onclick="removeProvider(route.provider)">Remove provider</button></div>`;
      return;
    }
    if (route.view === 'models' && route.model !== null) {
      const m = CFG.models[route.model] || {};
      head.innerHTML = `<div class="titles">
        <button class="back" onclick="go('models')">← Models</button>
        <h1>${esc(m.displayName || m.id || 'Model')}</h1>
        <p class="sub mono">${esc(m.cursorId || m.id || '')}</p>
      </div>
      <div class="actions"><button class="btn danger" onclick="removeModel(${route.model})">Remove model</button></div>`;
      return;
    }
    const meta = TITLES[route.view] || TITLES.overview;
    const actions = route.view === 'providers'
      ? '<button class="btn" onclick="addProvider()">Add provider</button>'
      : route.view === 'models'
        ? '<button class="btn" onclick="addModel()">Add model</button>'
        : route.view === 'raw'
          ? '<button class="btn" onclick="applyRaw()">Apply to editor</button>'
          : '';
    head.innerHTML = `<div class="titles"><h1>${meta[0]}</h1><p class="sub">${meta[1]}</p></div>
      <div class="actions">${actions}</div>`;
  }

  function renderBody() {
    if (!CFG) {
      $('page-body').innerHTML = '<div class="empty">Loading configuration…</div>';
      return;
    }
    if (route.view === 'overview') return renderOverview();
    if (route.view === 'providers') return route.provider ? renderProviderDetail() : renderProviderList();
    if (route.view === 'models') return route.model !== null ? renderModelDetail() : renderModelList();
    if (route.view === 'gateway') return renderGateway();
    if (route.view === 'raw') return renderRaw();
  }

  // ---------- form primitives ----------
  function row(name, desc, control) {
    return `<div class="form-row"><div class="lbl"><div class="name">${name}</div>${desc ? `<div class="desc">${desc}</div>` : ''}</div><div class="ctrl">${control}</div></div>`;
  }
  function wideRow(name, desc, control) {
    return `<div class="form-row"><div class="lbl"><div class="name">${name}</div>${desc ? `<div class="desc">${desc}</div>` : ''}</div><div class="ctrl wide">${control}</div></div>`;
  }
  function textInput(value, handler, opts = {}) {
    return `<input type="text" value="${attr(value ?? '')}" placeholder="${attr(opts.placeholder || '')}" ${opts.event || 'oninput'}="${handler}">`;
  }
  function numberInput(value, handler, opts = {}) {
    return `<input type="number" value="${value ?? ''}" placeholder="${attr(opts.placeholder || '')}" oninput="${handler}">`;
  }
  function check(label, checked, handler) {
    return `<label class="check"><input type="checkbox" ${checked ? 'checked' : ''} onchange="${handler}"> ${esc(label)}</label>`;
  }
  function backLink(view, text) {
    return `<button class="back" onclick="go('${view}')">← ${text}</button>`;
  }

  // ---------- overview ----------
  function renderOverview() {
    const providers = Object.keys(CFG.providers || {});
    const models = CFG.models || [];
    const s = STATUS || {};
    const enabled = models.filter((m) => m.enabled !== false).length;
    const warnings = (META && META.warnings) || [];

    const top = `<div class="metrics">
      <div class="metric"><div class="k">Gateway</div><div class="v mono">${esc((s.gateway && `${s.gateway.host}:${s.gateway.port}`) || '—')}</div></div>
      <div class="metric"><div class="k">Models</div><div class="v">${models.length} <span class="muted" style="font-size:12px">· ${enabled} enabled</span></div></div>
      <div class="metric"><div class="k">Native passthrough</div><div class="v small">${s.routing && s.routing.nativePassthrough ? 'Forwarding to Cursor' : 'Disabled'}</div></div>
      <div class="metric"><div class="k">Uptime</div><div class="v">${fmtUptime(s.uptimeMs || 0)}</div></div>
    </div>`;

    const modelRows = models.length ? models.map((m, i) => `
      <tr onclick="go('models', { model: ${i} })">
        <td><div class="cell"><div class="avatar">${esc((m.displayName || m.id || '?').slice(0, 1))}</div>
          <div class="grow"><div class="name">${esc(m.displayName || m.id || 'model')}</div><div class="meta mono">${esc(m.model || '')}</div></div></div></td>
        <td class="hide-sm muted">${esc(m.provider || '')}</td>
        <td class="hide-sm muted">${m.contextWindow ? Math.round(m.contextWindow / 1000) + 'k' : '—'}</td>
        <td><span class="status"><span class="dot ${m.enabled === false ? 'warn' : 'ok'}"></span>${m.enabled === false ? 'Off' : 'On'}</span></td>
      </tr>`).join('') : '';

    $('page-body').innerHTML = `${top}
      <div class="section">
        <div class="section-head"><h2>Models in the picker</h2><p class="desc">Requests for these models are handled locally and never reach Cursor's backend.</p></div>
        ${models.length
          ? `<table class="table"><thead><tr><th style="width:46%">Model</th><th class="hide-sm">Provider</th><th class="hide-sm" style="width:96px">Context</th><th style="width:82px">Status</th></tr></thead><tbody>${modelRows}</tbody></table>`
          : '<div class="empty">No models yet. <a href="#" onclick="go(\'models\');return false">Add one</a> after setting up a provider.</div>'}
      </div>
      <div class="section">
        <div class="section-head"><h2>Providers</h2><p class="desc">${providers.length} configured · credentials are stored locally.</p></div>
        ${providers.length
          ? `<table class="table"><thead><tr><th style="width:34%">Provider</th><th style="width:22%">Type</th><th class="hide-sm">Endpoint</th><th style="width:120px">Credentials</th></tr></thead><tbody>
              ${providers.map((name) => {
                const p = CFG.providers[name] || {};
                const has = p.hasApiKey || p.hasSecretAccessKey;
                return `<tr onclick="go('providers', { provider: this.dataset.name })" data-name="${attr(name)}">
                  <td><div class="cell"><div class="avatar">${esc(name.slice(0, 1))}</div><div class="name">${esc(name)}</div></div></td>
                  <td class="muted">${esc(p.type || 'unset')}</td>
                  <td class="hide-sm mono muted truncate">${esc(p.baseUrl || '—')}</td>
                  <td><span class="status"><span class="dot ${has ? 'ok' : p.credential ? 'warn' : 'bad'}"></span>${has ? 'Stored' : p.credential ? 'Credential' : 'Missing'}</span></td>
                </tr>`;
              }).join('')}
            </tbody></table>`
          : '<div class="empty">No providers yet.</div>'}
      </div>
      ${warnings.length ? `<div class="section"><div class="section-head"><h2>Warnings</h2></div><ul class="warnings">${warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></div>` : ''}`;
  }

  // ---------- providers ----------
  function providerNames() { return Object.keys(CFG.providers || {}); }

  function setProvider(name, key, value) {
    const provider = CFG.providers[name];
    if (!provider) return;
    if (key === 'clearApiKey' || key === 'clearSecretAccessKey' || key === 'clearSessionToken') {
      provider[key] = !!value;
      if (value) provider[key.replace('clear', '').replace(/^./, (c) => c.toLowerCase())] = '';
      return;
    }
    if (value) {
      if (key === 'apiKey') provider.clearApiKey = false;
      if (key === 'secretAccessKey') provider.clearSecretAccessKey = false;
      if (key === 'sessionToken') provider.clearSessionToken = false;
    }
    provider[key] = value;
    markDirty();
  }
  function setProviderType(name, type) {
    CFG.providers[name].type = type;
    markDirty();
    render();
  }
  function addProvider() {
    const base = 'provider';
    let name = base;
    let n = 2;
    while (CFG.providers[name]) name = `${base}-${n++}`;
    CFG.providers[name] = { type: 'openai-compatible', baseUrl: '', apiKey: '' };
    markDirty();
    go('providers', { provider: name });
  }
  function removeProvider(name) {
    const used = (CFG.models || []).filter((m) => m.provider === name);
    if (used.length) {
      toast(`Point those models at another provider first.`, 'bad', `"${esc(name)}" is in use by ${used.length} model${used.length === 1 ? '' : 's'}`);
      return;
    }
    if (!confirm(`Remove provider "${name}"?`)) return;
    delete CFG.providers[name];
    markDirty();
    go('providers');
  }

  function renderProviderList() {
    const names = providerNames();
    if (!names.length) {
      $('page-body').innerHTML = '<div class="empty">No providers yet. Add one to start routing models through your own endpoint.</div>';
      return;
    }
    const rows = names.map((name) => {
      const p = CFG.providers[name] || {};
      const count = (CFG.models || []).filter((m) => m.provider === name).length;
      const has = p.hasApiKey || p.hasSecretAccessKey;
      return `<tr onclick="go('providers', { provider: this.dataset.name })" data-name="${attr(name)}">
        <td><div class="cell"><div class="avatar">${esc(name.slice(0, 1))}</div>
          <div class="grow"><div class="name">${esc(name)}</div><div class="meta">${count} model${count === 1 ? '' : 's'}</div></div></div></td>
        <td class="muted">${esc(p.type || 'unset')}</td>
        <td class="mono muted truncate hide-sm">${esc(p.baseUrl || '—')}</td>
        <td><span class="status"><span class="dot ${has ? 'ok' : p.credential ? 'warn' : 'bad'}"></span>${has ? 'Stored' : p.credential ? 'Credential' : 'Missing'}</span></td>
        <td class="right"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></td>
      </tr>`;
    }).join('');
    $('page-body').innerHTML = `<table class="table">
      <thead><tr><th style="width:34%">Provider</th><th style="width:18%">Type</th><th class="hide-sm">Endpoint</th><th style="width:132px">Credentials</th><th style="width:28px"></th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  function renderProviderDetail() {
    const name = route.provider;
    const p = CFG.providers[name] || {};
    const isBedrock = p.type === 'bedrock';
    const isAzure = p.type === 'azure-openai';
    const typeOptions = TYPES.map((t) => `<option value="${t}" ${p.type === t ? 'selected' : ''}>${t}</option>`).join('');

    $('page-body').innerHTML = `
      <div class="section">
        <div class="section-head"><h2>Connection</h2><p class="desc">Where requests for this provider's models are sent.</p></div>
        ${row('Type', 'Determines the request and response protocol.', `<select onchange="setProviderType(route.provider, this.value)">${typeOptions}</select>`)}
        ${wideRow('Base URL', 'Root of the API, without the endpoint path.', textInput(p.baseUrl || '', `setProvider(route.provider, 'baseUrl', this.value)`, { placeholder: 'https://api.example.com/v1' }))}
        ${row('Endpoint path', 'Appended to the base URL for chat requests.', textInput(p.endpoint || '', `setProvider(route.provider, 'endpoint', this.value)`, { placeholder: '/chat/completions' }))}
        ${isAzure ? row('Deployment', 'Azure deployment name.', textInput(p.deployment || '', `setProvider(route.provider, 'deployment', this.value)`)) : ''}
        ${isAzure ? row('API version', 'Sent as api-version on every request.', textInput(p.apiVersion || '', `setProvider(route.provider, 'apiVersion', this.value)`)) : ''}
      </div>

      <div class="section">
        <div class="section-head"><h2>Credentials</h2><p class="desc">Stored in Windows Credential Manager. Nothing is sent to the browser.</p></div>
        ${row('API key', p.hasApiKey ? 'A key is already stored. Leave blank to keep it.' : 'Not set.', `<input type="password" autocomplete="off" value="" placeholder="${p.hasApiKey ? '•••••••••••• stored' : 'Not set'}" oninput="setProvider(route.provider, 'apiKey', this.value)">${p.hasApiKey ? check('Clear the stored key', false, `setProvider(route.provider, 'clearApiKey', this.checked)`) : ''}`)}
        ${isBedrock ? row('Region', 'AWS region for the Bedrock runtime.', textInput(p.region || '', `setProvider(route.provider, 'region', this.value)`, { placeholder: 'us-east-1' })) : ''}
        ${isBedrock ? row('Access key id', 'AWS access key id.', textInput(p.accessKeyId || '', `setProvider(route.provider, 'accessKeyId', this.value)`)) : ''}
        ${isBedrock ? row('Secret access key', p.hasSecretAccessKey ? 'Stored. Leave blank to keep it.' : 'Not set.', `<input type="password" autocomplete="off" value="" placeholder="${p.hasSecretAccessKey ? '•••••••••••• stored' : 'Not set'}" oninput="setProvider(route.provider, 'secretAccessKey', this.value)">`) : ''}
        ${isBedrock ? row('Session token', 'Optional, for temporary credentials.', `<input type="password" autocomplete="off" value="" placeholder="${p.hasSessionToken ? '•••••••••••• stored' : 'Optional'}" oninput="setProvider(route.provider, 'sessionToken', this.value)">${p.hasSecretAccessKey || p.hasSessionToken ? check('Clear the stored secret and session token', false, `setProvider(route.provider, 'clearSecretAccessKey', this.checked);setProvider(route.provider, 'clearSessionToken', this.checked)`) : ''}`) : ''}
        ${row('Credential source', 'Reuse a local integration credential when no key is set.', textInput(p.credential || '', `setProvider(route.provider, 'credential', this.value)`, { placeholder: 'opencode-go' }))}
      </div>

      <div class="section">
        <div class="section-head"><h2>Metadata</h2><p class="desc">Optional details used by model discovery and provider-specific headers.</p></div>
        ${row('models.dev provider id', 'Used by <span class="mono">npm run discover</span> to load effort tiers.', textInput(p.modelsDevProvider || '', `setProvider(route.provider, 'modelsDevProvider', this.value)`, { placeholder: 'opencode-go' }))}
        ${row('API version header', 'Sent as the version header on every request.', textInput(p.version || '', `setProvider(route.provider, 'version', this.value)`, { placeholder: '2023-06-01' }))}
      </div>

      <div class="section">
        <div class="section-head"><h2>Used by</h2><p class="desc">Models routed through this provider.</p></div>
        ${(CFG.models || []).filter((m) => m.provider === name).map((m) => `<div class="form-row"><div class="lbl"><div class="name">${esc(m.displayName || m.id)}</div></div><div class="ctrl"><span class="mono muted">${esc(m.model || '')}</span></div></div>`).join('') || '<div class="empty" style="padding:8px 0 16px">No models use this provider yet.</div>'}
      </div>`;
  }

  // ---------- models ----------
  function modelAt(index) { return (CFG.models || [])[index]; }
  function setModel(index, key, value) {
    const m = modelAt(index);
    if (!m) return;
    m[key] = value;
    markDirty();
  }
  function setModelNumber(index, key, value) {
    const m = modelAt(index);
    if (!m) return;
    const n = Number(value);
    if (value === '' || Number.isNaN(n)) delete m[key];
    else m[key] = n;
    markDirty();
  }
  function setCapability(index, key, value) {
    const m = modelAt(index);
    if (!m) return;
    m.capabilities = m.capabilities || {};
    m.capabilities[key] = !!value;
    markDirty();
  }
  function tierLabel(id) {
    return id ? id.charAt(0).toUpperCase() + id.slice(1) : id;
  }
  function effortText(model) {
    if (!model || !model.effort || !Array.isArray(model.effort.tiers)) return '';
    return model.effort.tiers.map((t) => `${t.id}:${t.label || tierLabel(t.id)}`).join(', ');
  }
  function contextText(model) {
    if (!model || !Array.isArray(model.contextOptions)) return '';
    return model.contextOptions.map((c) => `${c.id}:${c.value}`).join(', ');
  }
  function setEffortText(index, text) {
    const m = modelAt(index);
    const tiers = String(text).split(',').map((part) => part.trim()).filter(Boolean).map((part) => {
      const [id, ...rest] = part.split(':');
      const tierId = id.trim();
      return { id: tierId, label: (rest.join(':').trim() || tierLabel(tierId)), value: tierId };
    });
    if (!tiers.length) delete m.effort;
    else {
      const previous = m.effort || {};
      m.effort = {
        tiers,
        default: tiers.some((t) => t.id === previous.default) ? previous.default : tiers[0].id,
        requestField: previous.requestField || 'reasoning_effort',
      };
    }
    markDirty();
    renderBody();
  }
  function setEffortDefault(index, value) {
    const m = modelAt(index);
    if (!m.effort) return;
    m.effort.default = value;
    markDirty();
  }
  function setEffortField(index, value) {
    const m = modelAt(index);
    if (!m.effort) return;
    m.effort.requestField = value;
    markDirty();
  }
  function setContextText(index, text) {
    const m = modelAt(index);
    const options = String(text).split(',').map((part) => part.trim()).filter(Boolean).map((part) => {
      const [id, value] = part.split(':');
      const optionId = id.trim();
      return { id: optionId, label: optionId.toUpperCase(), value: Number(String(value || '').trim()) || 0 };
    });
    if (!options.length) delete m.contextOptions;
    else m.contextOptions = options;
    markDirty();
    renderBody();
  }
  function setLegacyIds(index, text) {
    const m = modelAt(index);
    const ids = String(text).split(',').map((s) => s.trim()).filter(Boolean);
    if (ids.length) m.legacyIds = ids; else delete m.legacyIds;
    markDirty();
  }
  function addModel() {
    const provider = providerNames()[0];
    if (!provider) {
      toast('Add a provider before adding models.', 'bad', 'No provider');
      return;
    }
    const used = new Set((CFG.models || []).map((m) => m.id));
    let id = 'model';
    let n = 2;
    while (used.has(id)) id = `model-${n++}`;
    CFG.models = CFG.models || [];
    CFG.models.push({
      id,
      displayName: 'New model',
      shortName: 'New model',
      providerLabel: provider,
      provider,
      model: id,
      contextWindow: 128000,
      maxOutput: 8192,
      fast: false,
      enabled: true,
      capabilities: { tools: true, vision: false, reasoning: false, streaming: true, cache: false },
    });
    markDirty();
    go('models', { model: CFG.models.length - 1 });
  }
  function removeModel(index) {
    const m = modelAt(index);
    if (!m) return;
    if (!confirm(`Remove model "${m.displayName || m.id}"?`)) return;
    CFG.models.splice(index, 1);
    markDirty();
    go('models');
  }

  function renderModelList() {
    const models = CFG.models || [];
    if (!models.length) {
      $('page-body').innerHTML = '<div class="empty">No models yet. Add one after configuring a provider.</div>';
      return;
    }
    const rows = models.map((m, index) => {
      const caps = [];
      if (m.capabilities && m.capabilities.tools) caps.push('tools');
      if (m.capabilities && m.capabilities.vision) caps.push('vision');
      if (m.capabilities && m.capabilities.reasoning) caps.push('reasoning');
      if (m.fast) caps.push('fast');
      return `<tr onclick="go('models', { model: ${index} })">
        <td><div class="cell"><div class="avatar">${esc((m.displayName || m.id || '?').slice(0, 1))}</div>
          <div class="grow"><div class="name">${esc(m.displayName || m.id || 'model')}</div><div class="meta mono">${esc(m.model || '')}</div></div></div></td>
        <td class="muted hide-sm">${esc(m.provider || '—')}</td>
        <td class="muted hide-sm">${m.contextWindow ? Math.round(m.contextWindow / 1000) + 'k' : '—'}</td>
        <td class="hide-sm">${caps.map((c) => `<span class="tag">${c}</span>`).join(' ') || '<span class="muted">—</span>'}</td>
        <td><span class="status"><span class="dot ${m.enabled === false ? 'warn' : 'ok'}"></span>${m.enabled === false ? 'Off' : 'On'}</span></td>
        <td class="right"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></td>
      </tr>`;
    }).join('');
    $('page-body').innerHTML = `<table class="table">
      <thead><tr><th style="width:34%">Model</th><th class="hide-sm">Provider</th><th class="hide-sm" style="width:88px">Context</th><th class="hide-sm">Capabilities</th><th style="width:74px">Status</th><th style="width:28px"></th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  function renderModelDetail() {
    const index = route.model;
    const m = modelAt(index);
    if (!m) { go('models'); return; }
    const effort = m.effort || null;
    const caps = m.capabilities || {};
    const providerOptions = providerNames().map((name) => `<option value="${attr(name)}" ${name === m.provider ? 'selected' : ''}>${esc(name)}</option>`).join('');
    const defaultOptions = effort
      ? effort.tiers.map((t) => `<option value="${attr(t.id)}" ${t.id === effort.default ? 'selected' : ''}>${esc(t.label || t.id)}</option>`).join('')
      : '<option value="">No effort tiers</option>';

    $('page-body').innerHTML = `
      <div class="section">
        <div class="section-head"><h2>Identity</h2><p class="desc">How the model appears in Cursor's picker.</p></div>
        ${wideRow('Display name', 'Shown in the model picker.', textInput(m.displayName || '', `setModel(${index}, 'displayName', this.value)`))}
        ${wideRow('Model id', 'Internal slug for this entry.', textInput(m.id || '', `setModel(${index}, 'id', this.value)`, { placeholder: 'deepseek-v4.1-flash' }))}
        ${wideRow('Cursor-facing id', 'The id Cursor sends. Generated from the prefix when left to the config.', `<div style="display:flex;align-items:center;gap:8px"><span class="mono muted">${esc(m.cursorId || '—')}</span>${m.cursorId ? `<button class="btn" data-copy="${attr(m.cursorId)}" onclick="copyText(this)">Copy</button>` : ''}</div>`)}
        ${row('Short name', 'Compact label used in tight UI.', textInput(m.shortName || '', `setModel(${index}, 'shortName', this.value)`))}
        ${row('Vendor', 'Vendor shown under the model name.', textInput(m.vendor || '', `setModel(${index}, 'vendor', this.value)`))}
        ${row('Provider label', 'Display label for the provider.', textInput(m.providerLabel || '', `setModel(${index}, 'providerLabel', this.value)`))}
      </div>

      <div class="section">
        <div class="section-head"><h2>Routing</h2><p class="desc">Where this model's requests are actually sent.</p></div>
        ${row('Provider', 'Each provider carries its own credentials.', `<select onchange="setModel(${index}, 'provider', this.value)">${providerOptions}</select>`)}
        ${wideRow('Real model id', 'Sent to the provider unchanged.', textInput(m.model || '', `setModel(${index}, 'model', this.value)`))}
        ${wideRow('Legacy ids', 'Older ids that should still resolve to this model.', textInput((m.legacyIds || []).join(', '), `setLegacyIds(${index}, this.value)`, { placeholder: 'old-id, another-id' }))}
      </div>

      <div class="section">
        <div class="section-head"><h2>Limits</h2><p class="desc">Advertised to Cursor so it budgets the conversation correctly.</p></div>
        ${row('Context window', 'Total tokens the model accepts.', `<input type="number" value="${m.contextWindow ?? ''}" oninput="setModelNumber(${index}, 'contextWindow', this.value)">`)}
        ${row('Max output', 'Largest response the model may return.', `<input type="number" value="${m.maxOutput ?? ''}" oninput="setModelNumber(${index}, 'maxOutput', this.value)">`)}
        ${wideRow('Context options', 'Picker choices as <span class="mono">id:token</span> pairs, comma separated.', textInput(contextText(m), `setContextText(${index}, this.value)`, { event: 'onchange', placeholder: '272k:272000, 1m:1000000' }))}
      </div>

      <div class="section">
        <div class="section-head"><h2>Reasoning</h2><p class="desc">Optional effort tiers exposed in the picker.</p></div>
        ${wideRow('Effort tiers', '<span class="mono">id:Label</span> pairs, comma separated. Applied on blur.', textInput(effortText(m), `setEffortText(${index}, this.value)`, { event: 'onchange', placeholder: 'low:Low, high:High, max:Max' }))}
        ${row('Default effort', 'Selected when the picker opens.', `<select onchange="setEffortDefault(${index}, this.value)" ${effort ? '' : 'disabled'}>${defaultOptions}</select>`)}
        ${row('Request field', 'Body field carrying the effort value.', textInput(effort ? effort.requestField || '' : '', `setEffortField(${index}, this.value)`, { placeholder: 'reasoning_effort' }))}
      </div>

      <div class="section">
        <div class="section-head"><h2>Capabilities</h2><p class="desc">What this model can do. Cursor hides features the model cannot handle.</p></div>
        ${wideRow('Supported', '', `<div class="checks">
          ${check('Tools', caps.tools, `setCapability(${index}, 'tools', this.checked)`)}
          ${check('Vision', caps.vision, `setCapability(${index}, 'vision', this.checked)`)}
          ${check('Reasoning', caps.reasoning, `setCapability(${index}, 'reasoning', this.checked)`)}
          ${check('Streaming', caps.streaming !== false, `setCapability(${index}, 'streaming', this.checked)`)}
          ${check('Cache', caps.cache, `setCapability(${index}, 'cache', this.checked)`)}
        </div>`)}
        ${wideRow('Behaviour', '', `<div class="checks">
          ${check('Fast mode', m.fast === true, `setModel(${index}, 'fast', this.checked)`)}
          ${check('Enabled', m.enabled !== false, `setModel(${index}, 'enabled', this.checked)`)}
        </div>`)}
      </div>`;
  }

  // ---------- gateway ----------
  function setNested(section, key, value) {
    CFG[section] = CFG[section] || {};
    if (key === 'port') {
      const n = Number(value);
      CFG[section][key] = Number.isNaN(n) ? value : n;
    } else CFG[section][key] = value;
    markDirty();
  }

  function renderGateway() {
    const g = CFG.gateway || {};
    const r = CFG.routing || {};
    const restart = META && META.restartRequired ? Object.entries(META.restartRequired).filter(([, v]) => v).map(([k]) => k) : [];

    $('page-body').innerHTML = `
      <div class="section">
        <div class="section-head"><h2>Listener</h2><p class="desc">Host and port changes need a gateway restart.</p></div>
        ${row('Host', 'Loopback only is recommended.', textInput(g.host || '127.0.0.1', `setNested('gateway', 'host', this.value)`))}
        ${row('Port', 'AnyCursor listens here for Cursor.', `<input type="number" value="${g.port ?? ''}" oninput="setNested('gateway', 'port', this.value)">`)}
        ${wideRow('Upstream', 'Cursor backend, used for native passthrough.', textInput(g.upstream || '', `setNested('gateway', 'upstream', this.value)`, { placeholder: 'https://api2.cursor.sh' }))}
        ${wideRow('Data directory', 'Sessions, logs and backups.', textInput(g.dataDir || '', `setNested('gateway', 'dataDir', this.value)`, { placeholder: '%LOCALAPPDATA%\\AnyCursor' }))}
      </div>

      <div class="section">
        <div class="section-head"><h2>Routing</h2><p class="desc">What happens to models AnyCursor does not know about.</p></div>
        ${row('Native passthrough', 'Forward unknown models to Cursor untouched.', check('Enabled', r.nativePassthrough !== false, `setNested('routing', 'nativePassthrough', this.checked)`))}
        ${row('Unknown model', 'Fallback when passthrough is off.', `<select onchange="setNested('routing', 'onUnknownModel', this.value)">
          <option value="native" ${r.onUnknownModel === 'native' ? 'selected' : ''}>native</option>
          <option value="error" ${r.onUnknownModel === 'error' ? 'selected' : ''}>error</option>
        </select>`)}
        ${wideRow('Default model', 'Used when a request names no model.', textInput(r.defaultModel || '', `setNested('routing', 'defaultModel', this.value)`, { placeholder: 'claude-anycursor-…' }))}
      </div>

      <div class="section">
        <div class="section-head"><h2>Configuration file</h2><p class="desc">${META && META.error ? `Config error: ${esc(META.error)}` : 'Changes apply to new requests immediately.'}${restart.length ? ` Restart required for: ${esc(restart.join(', '))}.` : ''}</p></div>
        <div class="form-row">
          <div class="lbl"><div class="name">Path</div><div class="desc">Backups are written next to it on save.</div></div>
          <div class="ctrl wide">
            <div class="mono muted">${esc((META && META.path) || '—')}</div>
            <div><button class="btn" onclick="copyPath(this)">Copy path</button></div>
          </div>
        </div>
        ${(META && META.warnings && META.warnings.length) ? `<ul class="warnings">${META.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
      </div>`;
  }

  async function copyText(btn) {
    try {
      await navigator.clipboard.writeText(btn.dataset.copy || '');
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1400);
    } catch (_) { toast('Clipboard is blocked by the browser.', 'bad'); }
  }

  async function copyPath(btn) {
    const text = (META && META.path) || '';
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = 'Copy path'; }, 1400);
    } catch (_) { toast('Clipboard is blocked by the browser.', 'bad'); }
  }

  // ---------- raw ----------
  function renderRaw() {
    $('page-body').innerHTML = `<div class="section" style="padding-top:20px">
      <div class="section-head"><h2>Configuration</h2><p class="desc">Stored secrets appear as empty strings — leave them empty to keep the saved value.</p></div>
      <textarea id="raw-json" spellcheck="false" style="min-height:60vh;resize:none;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.65"></textarea>
    </div>`;
    $('raw-json').value = JSON.stringify(CFG, null, 2);
  }

  function applyRaw() {
    const el = $('raw-json');
    if (!el) return;
    try {
      const parsed = JSON.parse(el.value);
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('config must be a JSON object');
      CFG = parsed;
      markDirty();
      go('providers');
      toast('The editor now matches your JSON. Save to write it to disk.', 'good', 'Applied');
    } catch (error) {
      toast(esc(error.message), 'bad', 'JSON error');
    }
  }

  // ---------- load / save ----------
  async function loadConfig() {
    try {
      const res = await fetch('/api/config', { cache: 'no-store' });
      META = await res.json();
      CFG = META.config || {};
      markDirty(false);
      render();
      updateStatus();
      if (META.error) toast(esc(META.error), 'bad', 'Config error');
    } catch (error) {
      toast('Cannot reach the gateway: ' + esc(error.message), 'bad', 'Offline');
      $('page-body').innerHTML = '<div class="empty">Cannot reach the gateway.</div>';
    }
  }

  async function saveConfig() {
    if (!CFG) return;
    $('save-btn').disabled = true;
    try {
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ config: CFG }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        toast(esc(data.error || `HTTP ${res.status}`), 'bad', 'Save failed');
        return;
      }
      META = data;
      CFG = data.config || CFG;
      markDirty(false);
      const restart = Object.entries(data.restartRequired || {}).filter(([, v]) => v).map(([k]) => k);
      toast((restart.length ? `Restart required for: ${esc(restart.join(', '))}.` : 'Applied to new requests without a restart.'),
        'good', 'Saved');
      render();
      updateStatus();
    } catch (error) {
      toast(esc(error.message), 'bad', 'Save failed');
    } finally {
      $('save-btn').disabled = false;
    }
  }

  async function reloadConfig() {
    if (dirty && !confirm('Discard unsaved changes and reload from disk?')) return;
    try {
      const res = await fetch('/api/config/reload', { method: 'POST' });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        toast(esc(data.error || `HTTP ${res.status}`), 'bad', 'Reload failed');
        return;
      }
      META = data;
      CFG = data.config || {};
      markDirty(false);
      go(route.view);
      updateStatus();
      toast('Loaded the configuration file from disk.', 'good', 'Reloaded');
    } catch (error) {
      toast(esc(error.message), 'bad', 'Reload failed');
    }
  }

  async function updateStatus() {
    try {
      const res = await fetch('/api/status', { cache: 'no-store' });
      const s = await res.json();
      STATUS = s;
      $('rail-dot').className = 'dot ' + (s.ok ? 'ok' : 'bad');
      $('rail-state').textContent = s.ok ? 'Ready' : 'Config error';
      $('rail-addr').textContent = `${s.gateway.host}:${s.gateway.port}`;
      if (s.version) $('rail-version').textContent = 'v' + s.version;
      if (route.view === 'overview') renderBody();
    } catch (_) {
      $('rail-dot').className = 'dot bad';
      $('rail-state').textContent = 'Offline';
    }
  }

  window.addEventListener('beforeunload', (event) => {
    if (!dirty) return;
    event.preventDefault();
    event.returnValue = '';
  });

  window.addEventListener('keydown', (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
      event.preventDefault();
      if (CFG) saveConfig();
    }
  });

  loadConfig();
  setInterval(updateStatus, 5000);
</script>
</body>
</html>
