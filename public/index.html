  :root {
    color-scheme: light;
    --page: #ffffff;
    --rail: #fbfbfc;
    --field: #f5f6f7;
    --line: #eef0f2;
    --line-2: #e3e6e9;
    --ink: #101114;
    --ink-2: #5f6570;
    --muted: #969ba3;
    --blue: #2563eb;
    --green: #0f8a49;
    --amber: #9a6a00;
    --red: #c0392b;
    --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; display: grid; grid-template-columns: 232px minmax(0, 1fr);
    background: var(--page); color: var(--ink);
    font: 13.5px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(37, 99, 235, .15); }
  a { color: var(--blue); text-decoration: none; }
  .mono { font-family: var(--mono); font-size: 11.5px; letter-spacing: -.01em; }
  .muted { color: var(--muted); }

  /* ---------------- sidebar ---------------- */
  .side {
    position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
    padding: 14px 12px; background: var(--rail); border-right: 1px solid var(--line);
  }
  .workspace { display: flex; align-items: center; padding: 4px 8px; margin-bottom: 14px; }
  .workspace .lockup { height: 28px; width: auto; display: block; }

  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav-label {
    padding: 16px 8px 6px; font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: .01em;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 8px; border: 0; border-radius: 9px; background: transparent;
    color: var(--ink-2); font: inherit; font-size: 13.5px; text-align: left; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .nav-item:hover { background: #f2f3f5; color: var(--ink); }
  .nav-item.active { background: #f1f2f4; color: var(--ink); font-weight: 500; }
  .nav-item svg { width: 17px; height: 17px; flex: none; color: #9aa0a8; }
  .nav-item.active svg { color: var(--ink-2); }
  .nav-item .n { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .nav-item .tag-new {
    margin-left: 6px; padding: 1px 5px; border-radius: 4px;
    background: #fdf3de; color: #8a5c00;
    font-size: 9.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  }
  .side-foot { margin-top: auto; padding: 12px 8px 2px; border-top: 1px solid var(--line); }
  .cfg-label { font-size: 11px; color: var(--muted); }
  .cfg-row { display: flex; align-items: center; gap: 4px; margin-top: 3px; min-width: 0; }
  .cfg-name {
    min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11.5px; color: var(--ink-2);
  }
  .cfg-copy {
    width: 22px; height: 22px; display: grid; place-items: center; flex: none;
    padding: 0; border: 0; border-radius: 5px; background: none; color: var(--muted); cursor: pointer;
  }
  .cfg-copy:hover { background: var(--field); color: var(--ink); }
  .cfg-copy svg { width: 13px; height: 13px; }
  .cfg-ver { margin-top: 5px; font-size: 10.5px; color: var(--muted); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--green); }
  .dot.bad { background: var(--red); }
  .dot.warn { background: var(--amber); }

  /* ---------------- top bar ---------------- */
  .main { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--page);
  }
  .search {
    position: relative; flex: 1; max-width: 620px; display: flex; align-items: center;
  }
  .search svg { position: absolute; left: 13px; width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
  .search input[type=text] {
    width: 100%; height: 38px; padding: 0 66px 0 41px; border-radius: 999px;
    border: 1px solid var(--line-2); background: var(--field); color: var(--ink);
    font: inherit; font-size: 13.5px; transition: background .12s, border-color .12s, box-shadow .12s;
  }
  .search input[type=text]::placeholder { color: #a2a7af; }
  .search input[type=text]:focus {
    outline: none; background: #fff; border-color: #cfd6df; box-shadow: 0 0 0 3px rgba(16, 17, 20, .04);
  }
  .search kbd {
    position: absolute; right: 9px; padding: 2px 7px; border-radius: 6px;
    border: 1px solid var(--line-2); background: #fff; color: var(--muted);
    font-family: var(--mono); font-size: 10.5px; line-height: 1.5;
  }
  .top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px;
    border-radius: 999px; border: 1px solid var(--line-2); background: #fff;
    font-size: 12.5px; color: var(--ink-2); white-space: nowrap;
  }
  .icon-btn {
    width: 36px; height: 36px; display: grid; place-items: center;
    border-radius: 999px; border: 1px solid var(--line-2); background: #fff;
    color: var(--ink-2); cursor: pointer; transition: background .12s;
  }
  .icon-btn:hover { background: #f7f8f9; }
  .icon-btn svg { width: 16px; height: 16px; }
  .notif-wrap { position: relative; }
  .notif-dot {
    position: absolute; top: 6px; right: 6px; width: 7px; height: 7px;
    border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 2px #fff;
  }
  .notif-panel {
    position: absolute; right: 0; top: 44px; z-index: 80; width: 330px;
    background: #fff; border: 1px solid var(--line-2); border-radius: 12px;
    box-shadow: 0 20px 44px -18px rgba(16, 17, 20, .28), 0 2px 6px -2px rgba(16, 17, 20, .08);
    overflow: hidden;
  }
  .notif-head {
    padding: 11px 14px; border-bottom: 1px solid var(--line);
    font-size: 12.5px; font-weight: 500;
  }
  .notif-list { max-height: 320px; overflow: auto; }
  .notif-item { display: flex; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .notif-item:last-child { border-bottom: 0; }
  .notif-item .ico {
    width: 26px; height: 26px; border-radius: 999px; flex: none; display: grid; place-items: center;
    background: #fdf3de; color: #8a5c00;
  }
  .notif-item .ico svg { width: 13px; height: 13px; }
  .notif-item .body { min-width: 0; flex: 1; }
  .notif-item .title { font-size: 12.5px; font-weight: 500; }
  .notif-item .detail {
    margin-top: 1px; font-family: var(--mono); font-size: 11px; color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .notif-item .when { margin-top: 3px; font-size: 11px; color: var(--muted); }
  .notif-item .go {
    align-self: center; padding: 0; border: 0; background: none;
    color: var(--blue); font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .notif-empty { padding: 22px 14px; text-align: center; color: var(--muted); font-size: 12.5px; }

  .avatar {
    width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center;
    background: #e8eefb; color: #2b4a86; font-size: 12px; font-weight: 600; letter-spacing: .01em;
  }

  /* ---------------- page ---------------- */
  .page { flex: 1; padding: 28px 32px 148px; }
  .page-head { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; }
  .page-head h1 { margin: 0; font-size: 31px; font-weight: 500; letter-spacing: -.035em; line-height: 1.1; }
  .crumbs { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; font-size: 12.5px; color: var(--muted); }
  .crumbs button { padding: 0; border: 0; background: none; color: var(--muted); font: inherit; cursor: pointer; }
  .crumbs button:hover { color: var(--ink); }
  .page-head .sub { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
  .page-head .actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }

  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .toolbar:empty { display: none; }
  .toolbar .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px;
    border-radius: 999px; border: 1px solid var(--line-2); background: #fff; color: var(--ink);
    font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
    transition: background .12s, border-color .12s;
  }
  .pill:hover { background: #f7f8f9; }
  .pill svg { width: 15px; height: 15px; color: #8c929b; }
  .pill.accent { color: var(--blue); border-color: #d6e0f5; }
  .pill.accent:hover { background: #f5f8ff; }
  .pill.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .pill.primary:hover { background: #26282e; }
  .pill select {
    appearance: none; border: 0; background: transparent; font: inherit; color: inherit;
    padding-right: 4px; cursor: pointer; max-width: 170px;
  }
  .pill select:focus { outline: none; }

  /* ---------------- summary ---------------- */
  .summary {
    display: grid; grid-template-columns: repeat(3, minmax(140px, 190px)) minmax(320px, 1fr);
    gap: 0; padding-bottom: 30px; margin-bottom: 10px;
  }
  .stat { padding-right: 26px; }
  .stat + .stat { padding-left: 26px; border-left: 1px solid var(--line); }
  .stat .k { font-size: 12.5px; color: var(--ink-2); }
  .stat .v {
    margin-top: 8px; font-size: 30px; font-weight: 500; letter-spacing: -.035em;
    line-height: 1.05; font-variant-numeric: tabular-nums;
  }
  .stat .f { margin-top: 5px; font-size: 12px; color: var(--muted); }
  .flow-wrap { padding-left: 26px; border-left: 1px solid var(--line); }

  /* ---------------- traffic path ---------------- */
  .flow { display: flex; align-items: stretch; gap: 8px; }
  .node {

    background: #fff;

  .node .k { font-size: 11px; color: var(--muted); }
  .node .v { margin-top: 3px; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .v.mono { font-size: 12px; font-weight: 400; }
  .flow .arrow { display: flex; align-items: center; color: #c6cad1; flex: none; }

  /* ---------------- tables ---------------- */
  .table { width: 100%; border-collapse: collapse; table-layout: fixed; }

  .overview { display: grid; grid-template-columns: minmax(0, 1fr) 304px; gap: 38px; align-items: start; }
  .overview-rail { position: sticky; top: 20px; }

  .usage-panel .panel-body { padding: 20px 20px 22px; }
  .donut-wrap { position: relative; width: 208px; height: 208px; margin: 2px auto 16px; }

  .donut-center {

    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; pointer-events: none;
  }
  .donut-center b { font-size: 26px; font-weight: 500; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .donut-center span { font-size: 11px; color: var(--muted); }

  }
  .donut-mark .logo svg { width: 20px; height: 20px; }
  .legend { display: flex; flex-direction: column; gap: 9px; }
  .lg-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }

  .lg-ico { display: inline-flex; flex: none; }
  .lg-ico .logo { width: 20px; height: 20px; background: transparent; border: 0; box-shadow: none; }
  .lg-ico .logo svg { width: 16px; height: 16px; }
  .lg-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lg-row .pc { color: var(--muted); font-variant-numeric: tabular-nums; }
  .lg-meta { margin: -4px 0 2px 28px; font-size: 11px; color: var(--muted); }
  .usage-empty { padding: 34px 6px 32px; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.6; }

  .table-title {
    display: flex; align-items: baseline; gap: 8px; margin: 10px 0 2px;
    padding-top: 34px; border-top: 1px solid var(--line);
  }
  .table-title h2 { margin: 0; font-size: 13.5px; font-weight: 500; letter-spacing: -.01em; }
  .table-title .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .table-title .spacer { flex: 1; }
  .table-title .link {
    padding: 0; border: 0; background: none; color: var(--ink-2);
    font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .table-title .link:hover { color: var(--blue); text-decoration: underline; }
  .table td { padding: 0 12px; height: 50px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .table tbody tr:last-child td { border-bottom: 0; }

  .table tbody tr:hover td { background: #fafbfc; }
  .table th:first-child, .table td:first-child { padding-left: 4px; }
  .table th:last-child, .table td:last-child { padding-right: 4px; }
  .cell { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .cell .logo {
    width: 30px; height: 30px; border-radius: 999px; flex: none; display: grid; place-items: center;
    background: #f1f3f6; color: #4b515a; font-size: 11.5px; font-weight: 600; text-transform: uppercase;
    border: 1px solid transparent; overflow: hidden;
  }
  .cell .logo.brand { background: #fff; border-color: var(--line-2); }
  .cell .logo.brand svg { width: 16px; height: 16px; display: block; }
  .cell .name { font-size: 13.5px; font-weight: 500; color: var(--ink); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell .meta { margin-top: 0; font-size: 11.5px; line-height: 1.35; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell .grow { min-width: 0; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
  .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; background: #f3f4f6; font-size: 11.5px; color: var(--ink-2); }
  .right { text-align: right; }
  .nowrap { white-space: nowrap; }
  .chev-cell { width: 34px; text-align: right; opacity: 0; transition: opacity .12s; }
  .table tbody tr:hover .chev-cell { opacity: 1; }
  .chev { width: 14px; height: 14px; color: #b9bec6; }
  @media (hover: none) { .chev-cell { opacity: .5; } }

  /* ---------------- sections / forms ---------------- */
  .panel { border: 1px solid var(--line-2); border-radius: 14px; background: #fff; overflow: hidden; }
  .panel + .panel { margin-top: 14px; }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 15px 18px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { margin: 0; font-size: 14px; font-weight: 500; letter-spacing: -.01em; }
  .panel-head .sub { font-size: 12.5px; color: var(--muted); }
  .panel-head .spacer { flex: 1; }
  .panel-body { padding: 6px 18px 10px; }

  .section + .section { border-top: 1px solid var(--line); }
  .section { padding: 6px 0 10px; }
  .section-title { padding: 14px 0 4px; }
  .section-title h3 { margin: 0; font-size: 13.5px; font-weight: 500; letter-spacing: -.005em; }
  .section-title p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-2); }

  .row { display: grid; grid-template-columns: 212px minmax(0, 1fr); gap: 26px; padding: 12px 0; align-items: center; }
  .row .label { font-size: 13px; font-weight: 500; color: var(--ink); }
  .row .desc { margin-top: 2px; font-size: 12px; line-height: 1.45; color: var(--muted); font-weight: 400; }
  .field-inline { display: flex; gap: 8px; align-items: center; }
  .field-inline input { flex: 1; min-width: 0; }
  .lookup-note { font-size: 11.5px; color: var(--muted); }
  .lookup-note.ok { color: var(--green); }
  .control { display: flex; flex-direction: column; gap: 7px; max-width: 420px; min-width: 0; }

  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%; height: 36px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--line-2); background: #fff; color: var(--ink);
    font: inherit; font-size: 13.5px; transition: border-color .12s, box-shadow .12s;
  }
  textarea { height: auto; padding: 12px 14px; }
  select {
    appearance: none; padding-right: 30px;
    background-image: linear-gradient(45deg, transparent 50%, #9aa0a8 50%), linear-gradient(135deg, #9aa0a8 50%, transparent 50%);
    background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
    background-size: 4.5px 4.5px, 4.5px 4.5px; background-repeat: no-repeat;
  }
  input:hover, select:hover, textarea:hover { border-color: #d3d8de; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: #b9c5d8; box-shadow: 0 0 0 3px rgba(16, 17, 20, .04);
  }
  input::placeholder, textarea::placeholder { color: #a8adb5; }
  input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--ink); margin: 0; flex: none; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 20px; }

  /* custom select */
  .sel { position: relative; width: 100%; max-width: 420px; }
  .sel-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; height: 36px; padding: 0 12px;
    border: 1px solid var(--line-2); border-radius: 10px; background: #fff;
    font: inherit; font-size: 13.5px; color: var(--ink); cursor: pointer; text-align: left;
    transition: border-color .12s, box-shadow .12s;
  }
  .sel-btn span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sel-btn > svg { width: 14px; height: 14px; color: #9aa0a8; flex: none; transition: transform .15s; }
  .sel-btn:hover { border-color: #d3d8de; }
  .sel.open { z-index: 70; }

  .sel.open .sel-btn > svg { transform: rotate(180deg); }
  .sel-menu {
    position: absolute; left: 0; top: calc(100% + 6px); z-index: 60; min-width: 100%;
    padding: 5px; border: 1px solid var(--line-2); border-radius: 12px; background: #fff;

    display: none; max-height: 280px; overflow: auto;
  }
  .sel.open .sel-menu { display: block; }
  .sel-filter {
    position: sticky; top: 0; z-index: 1; width: 100%; height: 30px; margin-bottom: 5px;
    padding: 0 9px; border: 1px solid var(--line-2); border-radius: 7px; background: #fff;
    font: inherit; font-size: 12.5px; color: var(--ink);
  }
  .sel-filter:focus { outline: none; border-color: #b9c5d8; box-shadow: 0 0 0 3px rgba(16, 17, 20, .04); }
  .sel-opt {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 9px;
    border: 0; border-radius: 8px; background: none; font: inherit; font-size: 13.5px;
    color: var(--ink); text-align: left; cursor: pointer; white-space: nowrap;
  }
  .sel-opt:hover { background: #f5f6f7; }
  .sel-opt .tick { margin-left: auto; width: 14px; height: 14px; color: var(--blue); opacity: 0; }
  .sel-opt.on .tick { opacity: 1; }
  .sel.pill { width: auto; max-width: none; display: inline-block; border: 0; background: none; padding: 0; height: auto; }
  .sel.pill .sel-btn { height: 34px; border-radius: 999px; padding: 0 13px; font-size: 13px; }
  .sel.pill .sel-menu { min-width: 210px; }

  /* chip editor */
  .chips {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 5px 6px;
    min-height: 38px; border: 1px solid var(--line-2); border-radius: 10px; background: #fff;
    transition: border-color .12s, box-shadow .12s; cursor: text;
  }
  .chips:focus-within { border-color: #b9c5d8; box-shadow: 0 0 0 3px rgba(16, 17, 20, .04); }
  .chip-item {
    display: inline-flex; align-items: center; gap: 4px; height: 25px; padding: 0 5px 0 10px;
    border-radius: 999px; background: #f1f3f6; font-size: 12px; color: var(--ink-2);
  }
  .chip-item b { font-weight: 500; color: var(--ink); }
  .chip-item button {
    width: 16px; height: 16px; display: grid; place-items: center; padding: 0;
    border: 0; border-radius: 999px; background: transparent; color: #8c929b;
    font-size: 13px; line-height: 1; cursor: pointer;
  }
  .chip-item button:hover { background: #e2e6ea; color: var(--ink); }
  .chip-input {
    flex: 1; min-width: 120px; height: 25px; border: 0; background: none; color: var(--ink);
    font: inherit; font-size: 13px; padding: 0 4px;
  }
  .chip-input:focus { outline: none; }
  .chip-input::placeholder { color: #a8adb5; }

  /* segmented control */
  .seg { display: inline-flex; gap: 3px; padding: 3px; border-radius: 11px; background: #f3f4f6; align-self: flex-start; }
  .seg-btn {
    height: 28px; padding: 0 13px; border: 0; border-radius: 8px; background: transparent;
    font: inherit; font-size: 12.5px; color: var(--ink-2); cursor: pointer; transition: background .12s, color .12s;
  }
  .seg-btn:hover { color: var(--ink); }
  .seg-btn.on { background: #fff; color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(16, 17, 20, .1); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--line-2); background: #fff; color: var(--ink);
    font: inherit; font-size: 13px; cursor: pointer; transition: background .12s, border-color .12s;
  }
  .btn:hover { background: #f7f8f9; }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.primary:hover { background: #26282e; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn.ghost:hover { background: var(--field); color: var(--ink); }
  .btn.danger { color: var(--ink-2); }
  .btn.danger:hover { color: var(--red); border-color: #f0d6d3; background: #fdf7f6; }
  .btn:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid rgba(37, 99, 235, .4); outline-offset: 1px;
  }

  /* ---------------- detail ---------------- */
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 30px; align-items: start; }
  .meta { position: sticky; top: 20px; padding-top: 4px; }
  .meta-item { padding: 0 0 16px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .meta-item:last-child { border-bottom: 0; margin-bottom: 0; }
  .meta-item .k { font-size: 12px; color: var(--muted); }
  .meta-item .v { margin-top: 4px; font-size: 13px; line-height: 1.5; word-break: break-word; }
  .meta-item .v.mono { font-size: 11.5px; color: var(--ink-2); }
  .meta-copy { margin-top: 5px; padding: 0; border: 0; background: none; color: var(--blue); font: inherit; font-size: 12px; cursor: pointer; }
  .meta-copy:hover { text-decoration: underline; }

  .onboard { padding: 46px 20px 50px; text-align: center; border: 1px dashed var(--line-2); border-radius: 14px; }
  .onboard .ico {
    width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 12px; display: grid; place-items: center;
    background: #f0f5ff; border: 1px solid #dce6f8;
  }
  .onboard .ico svg { width: 22px; height: 22px; color: #4d7fd6; }
  .onboard h2 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: -.015em; }
  .onboard p { margin: 7px auto 18px; max-width: 430px; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
  .onboard .steps { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .onboard .step { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
  .onboard .step b { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 999px; background: #f1f3f6; font-size: 10.5px; font-weight: 600; color: var(--ink-2); }

  .discover { border: 1px solid #ece3cd; background: #fffdf7; border-radius: 12px; padding: 14px 16px 10px; margin-bottom: 20px; }
  .discover h3 { margin: 0; font-size: 13px; font-weight: 600; }
  .discover > p { margin: 3px 0 8px; font-size: 12px; color: var(--ink-2); }
  .discover-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #f2ecdd; }
  .discover-row .id { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .discover-row .meta { font-size: 11px; color: var(--muted); white-space: nowrap; }

  .empty { padding: 40px 16px 44px; text-align: center; color: var(--muted); font-size: 13px; }
  .empty strong { display: block; margin-bottom: 3px; color: var(--ink); font-size: 13.5px; font-weight: 500; }

  /* ---------------- floating save ---------------- */
  .savebar {
    position: fixed; right: 24px; bottom: 24px; z-index: 30;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 8px 8px 16px; border-radius: 999px;
    border: 1px solid var(--line-2); background: rgba(255, 255, 255, .94);
    backdrop-filter: blur(12px); box-shadow: 0 12px 34px -12px rgba(16, 17, 20, .22), 0 2px 6px -2px rgba(16, 17, 20, .08);
    transition: opacity .15s, transform .15s;
  }
  .savebar .dirty { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
  .savebar .kbd {
    padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--muted);
    font-family: var(--mono); font-size: 10.5px;
  }

  /* ---------------- toast ---------------- */
  .toast {
    position: fixed; right: 24px; bottom: 86px; z-index: 90; max-width: 380px;
    padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line-2);
    background: #fff; font-size: 13px; color: var(--ink);
    box-shadow: 0 18px 44px -18px rgba(16, 17, 20, .28);
    opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .15s, transform .15s;
  }
  .toast.show { opacity: 1; transform: none; pointer-events: auto; }
  .toast.good { border-color: #d6e8dd; }
  .toast.bad { border-color: #f0d6d3; }
  .toast .t { font-weight: 500; margin-bottom: 2px; }
  .toast .b { color: var(--ink-2); word-break: break-word; }

  .warnings { margin: 8px 0 4px; padding-left: 18px; color: var(--amber); font-size: 12.5px; }
  .warnings li + li { margin-top: 3px; }

  /* ---------------- responsive ---------------- */
  @media (max-width: 1240px) { .overview { grid-template-columns: minmax(0, 1fr); } .overview-rail { position: static; max-width: 360px; } }
  @media (max-width: 1180px) {
    .summary { grid-template-columns: repeat(3, minmax(120px, 1fr)); }
    .flow-wrap { grid-column: 1 / -1; margin-top: 20px; padding: 18px 0 0; border-left: 0; border-top: 1px solid var(--line); }
    .detail { grid-template-columns: minmax(0, 1fr); }
    .meta { position: static; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }
  }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 2px; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--line); }
    .workspace { width: auto; margin: 0 10px 0 0; padding: 4px 6px; }
    .workspace .chev, .nav-label, .side-foot { display: none; }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .nav-item { width: auto; padding: 6px 9px; }
    .topbar { padding: 10px 16px; }
    .page { padding: 20px 16px 110px; }
    .page-head h1 { font-size: 26px; }
  }
  @media (max-width: 680px) {
    .search kbd, .status-pill { display: none; }
    .search { min-width: 0; }
    .search input[type=text] { min-width: 0; }
    .top-actions { gap: 6px; flex: none; }
    .page-head { flex-wrap: wrap; }
    .page-head .actions { margin-left: 0; width: 100%; }
    .row { grid-template-columns: 1fr; gap: 6px; padding: 12px 0 14px; }
    .control { max-width: none; }
    .table .hide-sm, .hide-sm { display: none; }
    .table th { width: auto !important; }
    .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat { padding-right: 16px; }
    .stat + .stat { border-left: 0; padding-left: 0; }

    .flow { flex-direction: column; }
    .flow .arrow { justify-content: center; padding: 2px 0; transform: rotate(90deg); }
    .page-head .actions { margin-left: 0; }
    .savebar { left: 16px; right: 16px; justify-content: flex-end; }
  }
</style>
