  function brandFor(text) {
    const hay = String(text || '').toLowerCase();
    if (!hay) return null;
    for (const [needle, slug] of BRAND_MATCH) {
      if (hay.includes(needle) && BRANDS[slug]) return slug;
    }
    return null;
  }
  function brandIcon(slug, fallback) {
    const brand = slug && BRANDS[slug];
    if (brand) {
      return `<span class="logo brand" style="color:${brand.c}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${brand.d}"/></svg></span>`;
    }
    return `<span class="logo">${esc(fallback)}</span>`;
  }
  function modelIcon(m) {
    const slug = brandFor([m.id, m.model, m.vendor, m.displayName].join(' '));
    return brandIcon(slug, (m.displayName || m.id || '?').slice(0, 1));
  }
  function providerIcon(name, p) {
    const provider = p || {};
    const slug = brandFor([name, provider.credential, provider.modelsDevProvider, provider.baseUrl, provider.type].join(' '));
    return brandIcon(slug, (name || '?').slice(0, 1));
  }

  const route = { view: 'overview', provider: null, model: null };
  let CFG = null;
  let META = null;
  let STATUS = null;
  let dirty = false;
  let query = '';
  let lastSelections = '';
  let uptimeBase = 0;
  let uptimeAt = 0;

  function uptimeNow() {
    return uptimeBase + (uptimeAt ? Date.now() - uptimeAt : 0);
  }
  function tickUptime() {
    document.querySelectorAll('[data-uptime]').forEach((el) => { el.textContent = fmtUptime(uptimeNow()); });
  }

  /* ---------- notifications ---------- */
  const NOTIFS = [];
  let notifSeenAt = 0;
  function notify(id, title, detail, at) {
    if (!id || NOTIFS.some((n) => n.id === id)) return;
    NOTIFS.unshift({ id, title, detail, at: at || new Date().toISOString() });
    if (NOTIFS.length > 30) NOTIFS.length = 30;
  }
  function unreadCount() {
    return NOTIFS.filter((n) => Date.parse(n.at) > notifSeenAt).length;
  }
  function renderNotifs() {
    const dot = document.getElementById('notif-dot');
    if (dot) dot.hidden = unreadCount() === 0;
    const panel = document.getElementById('notif-panel');
    if (!panel || panel.hidden) return;
    if (!NOTIFS.length) {
      panel.innerHTML = '<div class="notif-head">Notifications</div><div class="notif-empty">Nothing yet. Gateway events and newly detected models appear here.</div>';
      return;
    }
    panel.innerHTML = `<div class="notif-head">Notifications</div><div class="notif-list">${NOTIFS.map((n) => `
      <div class="notif-item">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></span>
        <span class="body">
          <div class="title">${esc(n.title)}</div>
          <div class="detail">${esc(n.detail)}</div>
          <div class="when">${esc(ago(n.at))}</div>
        </span>
        <button class="go" onclick="openFromNotif()">Review</button>
      </div>`).join('')}</div>`;
  }
  function toggleNotifs(event) {
    if (event) event.stopPropagation();
    const panel = document.getElementById('notif-panel');
    if (!panel) return;
    const open = !panel.hidden;
    document.querySelectorAll('.sel.open').forEach((x) => x.classList.remove('open'));
    panel.hidden = open;
    if (!open) {
      notifSeenAt = Date.now();
      renderNotifs();
    }
  }
  function openFromNotif() {
    document.getElementById('notif-panel').hidden = true;
    go('models');
  }
  document.addEventListener('click', () => {
    const panel = document.getElementById('notif-panel');
    if (panel && !panel.hidden) panel.hidden = true;
  });
  let typeFilter = '';
  let statusFilter = '';
  let toastTimer = null;

  function toast(html, kind, title) {
    const el = $('toast');
    el.innerHTML = (title ? `<div class="t">${title}</div>` : '') + `<div class="b">${html}</div>`;
    el.className = 'toast show ' + (kind || '');
    clearTimeout(toastTimer);
    if (kind === 'good') toastTimer = setTimeout(() => { el.className = 'toast'; }, 3200);
  }

  function markDirty(value) {
    dirty = value !== false;
    $('dirty').textContent = dirty ? 'Unsaved changes' : 'All changes saved';
    $('dirty').style.color = dirty ? 'var(--amber)' : 'var(--muted)';
  }

  function go(view, opts) {
    route.view = view;
    route.provider = null;
    route.model = null;
    typeFilter = '';
    statusFilter = '';
    if (opts) Object.assign(route, opts);
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function onSearch(value) {
    query = value.trim().toLowerCase();
    if (route.view === 'overview' || route.view === 'providers' || route.view === 'models') renderBody();
    else if (query) go('models');
  }

  function filterRows() {
    document.querySelectorAll('[data-search]').forEach((el) => {
      const hay = el.dataset.search || '';
      const type = el.dataset.type || '';
      const state = el.dataset.state || '';
      const hit = (!query || hay.includes(query))
        && (!typeFilter || type === typeFilter)
        && (!statusFilter || state === statusFilter);
      el.style.display = hit ? '' : 'none';
    });
    const all = document.querySelectorAll('[data-search]');
    const shown = [...all].filter((e) => e.style.display !== 'none').length;
    const out = document.getElementById('result-count');
    if (out) out.textContent = all.length ? shown + ' of ' + all.length : '';
  }

  function render() {
    document.querySelectorAll('.nav-item').forEach((b) => {
      b.classList.toggle('active', b.dataset.view === route.view);
    });
    renderHead();
    renderTools();
    renderBody();
    renderCounts();
    renderDiscoveredBadge();
  }

  function renderCounts() {
    if (!CFG) return;
    $('nav-providers').textContent = Object.keys(CFG.providers || {}).length || '';
    $('nav-models').textContent = (CFG.models || []).length || '';
  }

  function renderHead() {
    const head = $('page-head');
    if (route.view === 'providers' && route.provider) {
      const p = CFG.providers[route.provider] || {};
      head.innerHTML = `<div>
          <div class="crumbs"><button onclick="go('providers')">Providers</button><span>/</span><span>${esc(route.provider)}</span></div>
          <h1>${esc(route.provider)}</h1>
          <p class="sub">${esc(p.type || 'unset')}</p>
        </div>
        <div class="actions"><button class="btn danger" onclick="removeProvider(route.provider)">Remove provider</button></div>`;
      return;
    }
    if (route.view === 'models' && route.model !== null) {
      const m = CFG.models[route.model] || {};
      head.innerHTML = `<div>
          <div class="crumbs"><button onclick="go('models')">Models</button><span>/</span><span>${esc(m.displayName || m.id || '')}</span></div>
          <h1>${esc(m.displayName || m.id || 'Model')}</h1>
          <p class="sub mono">${esc(effectiveCursorId(m) || m.id || '')}</p>
        </div>
        <div class="actions"><button class="btn danger" onclick="removeModel(${route.model})">Remove model</button></div>`;
      return;
    }
    const meta = TITLES[route.view] || TITLES.overview;
    const action = route.view === 'providers'
      ? '<button class="pill" onclick="addProvider()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg> Add provider</button>'
      : route.view === 'models'
        ? '<button class="pill" onclick="addModel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg> Add model</button>'
        : route.view === 'raw'
          ? '<button class="pill" onclick="applyRaw()">Apply to editor</button>'
          : '';
    head.innerHTML = `<div><h1>${meta[0]}</h1><p class="sub">${meta[1]}</p></div><div class="actions">${action}</div>`;
  }

  function renderTools() {
    const tools = $('page-tools');
    if (route.view === 'providers' && !route.provider) {
      tools.innerHTML = `
        ${select([{ value: '', label: 'All types' }, ...TYPES.map((t) => ({ value: t, label: t }))], typeFilter, (v) => { typeFilter = v; filterRows(); }, { className: 'pill' })}
        ${select([{ value: '', label: 'Any credentials' }, { value: 'ok', label: 'Stored' }, { value: 'warn', label: 'Credential source' }, { value: 'bad', label: 'Missing' }], statusFilter, (v) => { statusFilter = v; filterRows(); }, { className: 'pill' })}
        <span class="muted" style="font-size:12.5px;margin-left:2px" id="result-count"></span>`;
      return;
    }
    if (route.view === 'models' && route.model === null) {
      tools.innerHTML = `
        ${select([{ value: '', label: 'All providers' }, ...Object.keys(CFG.providers || {}).map((n) => ({ value: n, label: n }))], typeFilter, (v) => { typeFilter = v; filterRows(); }, { className: 'pill' })}
        ${select([{ value: '', label: 'Any status' }, { value: 'ok', label: 'Enabled' }, { value: 'warn', label: 'Disabled' }], statusFilter, (v) => { statusFilter = v; filterRows(); }, { className: 'pill' })}
        <span class="muted" style="font-size:12.5px;margin-left:2px" id="result-count"></span>`;
      return;
    }
    tools.innerHTML = '';
  }

  function renderBody() {
    if (!CFG) { $('page-body').innerHTML = '<div class="empty">Loading configuration…</div>'; return; }
    if (route.view === 'overview') return renderOverview();
    if (route.view === 'providers') return route.provider ? renderProviderDetail() : renderProviderList();
    if (route.view === 'models') return route.model !== null ? renderModelDetail() : renderModelList();
    if (route.view === 'gateway') return renderGateway();
    if (route.view === 'raw') return renderRaw();
  }

  function row(name, desc, control) {
    return `<div class="row"><div><div class="label">${name}</div>${desc ? `<div class="desc">${desc}</div>` : ''}</div><div class="control">${control}</div></div>`;
  }
  function textInput(value, handler, opts = {}) {
    return `<input type="text" value="${attr(value ?? '')}" placeholder="${attr(opts.placeholder || '')}" ${opts.event || 'oninput'}="${handler}">`;
  }
  function check(label, checked, handler) {
    return `<label class="check"><input type="checkbox" ${checked ? 'checked' : ''} onchange="${handler}"> ${esc(label)}</label>`;
  }

  /* ---------- custom select ---------- */
  let selSeq = 0;
  const selRegistry = new Map();
  function select(options, value, onChange, opts = {}) {
    const id = 'sel' + (++selSeq);
    selRegistry.set(id, { options, value, onChange });
    return selectMarkup(id, opts.className || '');
  }
  function selectMarkup(id, extra) {
    const entry = selRegistry.get(id);
    const { options } = entry;
    const cur = options.find((o) => o.value === entry.value) || options[0] || { value: '', label: '—' };
    return `<div class="sel ${extra}" id="${id}">
      <button type="button" class="sel-btn" onclick="toggleSelect('${id}', event)" aria-haspopup="listbox">
        <span>${esc(cur.label)}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="sel-menu" role="listbox">
        ${options.length > 15 ? `<input class="sel-filter" type="text" placeholder="Filter…" onclick="event.stopPropagation()" oninput="filterSelect('${id}', this.value)">` : ''}
        ${options.map((o) => `<button type="button" class="sel-opt${o.value === cur.value ? ' on' : ''}" onclick="pickSelect('${id}', '${attr(o.value)}')">
          <span>${esc(o.label)}</span>
          <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 13 4 4L19 7"/></svg>
        </button>`).join('')}
      </div>
    </div>`;
  }
  function toggleSelect(id, event) {
    if (event) event.stopPropagation();
    const el = document.getElementById(id);
    if (!el) return;
    const open = el.classList.contains('open');
    document.querySelectorAll('.sel.open').forEach((x) => x.classList.remove('open'));
    if (open) return;
    el.classList.add('open');
    const filter = el.querySelector('.sel-filter');
    if (filter) requestAnimationFrame(() => filter.focus());
  }
  function filterSelect(id, value) {
    const el = document.getElementById(id);
    if (!el) return;
    const query = String(value || '').trim().toLowerCase();
    el.querySelectorAll('.sel-opt').forEach((opt) => {
      const hit = !query || opt.textContent.toLowerCase().includes(query);
      opt.style.display = hit ? '' : 'none';
    });
  }
  function pickSelect(id, value) {
    const entry = selRegistry.get(id);
    if (!entry) return;
    entry.value = value;
    const el = document.getElementById(id);
    if (el) {
      el.classList.remove('open');
      const cur = entry.options.find((o) => o.value === value);
      const label = el.querySelector('.sel-btn span');
      if (label && cur) label.textContent = cur.label;
      el.querySelectorAll('.sel-opt').forEach((b, i) => b.classList.toggle('on', entry.options[i].value === value));
    }
    if (entry.onChange) entry.onChange(value);
  }
  document.addEventListener('click', () => {
    document.querySelectorAll('.sel.open').forEach((x) => x.classList.remove('open'));
  });

  /* ---------- chip editors ---------- */
  function focusChip(id) {
    const el = document.getElementById(id);
    if (el) el.focus();
  }
  function fmtTokens(n) {
    const v = Number(n) || 0;
    if (!v) return '—';
    if (v >= 1000000) return (v / 1000000).toFixed(v % 1000000 ? 1 : 0) + 'M';
    if (v >= 1000) return Math.round(v / 1000) + 'K';
    return String(v);
  }
  function selectionFor(m) {
    const all = (STATUS && STATUS.selections) || {};
    return m ? (all[m.cursorId] || all[m.id]) : undefined;
  }
  function selectionLabel(sel, m) {
    if (!sel) return '';
    const parts = [];
    if (sel.effort) {
      const id = String(sel.effort);
      const tier = m && m.effort && (m.effort.tiers || []).find((t) => t.id === id);
      parts.push(tier ? (tier.label || tier.id) : id.charAt(0).toUpperCase() + id.slice(1));
    }
    if (sel.context) {
      const opt = m && (m.contextOptions || []).find((o) => o.id === sel.context);
      parts.push(opt ? (opt.label || fmtTokens(opt.value)) : sel.context);
    }
    parts.push(sel.fast ? 'Fast' : 'Standard');
    return parts.join(' · ');
  }
  function ago(iso) {
    const then = Date.parse(iso || '');
    if (!then) return 'just now';
    const mins = Math.max(0, Math.round((Date.now() - then) / 60000));
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hours = Math.round(mins / 60);
    if (hours < 24) return hours + 'h ago';
    return Math.round(hours / 24) + 'd ago';
  }
  function liveSelectionMarkup(m) {
    const sel = selectionFor(m);
    if (!sel) return `<div class="k">In Cursor</div><div class="v muted">Waiting for a request</div>`;
    return `<div class="k">In Cursor</div><div class="v">${esc(selectionLabel(sel, m))}<br><span class="muted">seen ${esc(ago(sel.at))}</span></div>
      <button class="meta-copy" onclick="applySelection()">Use as default</button>`;
  }
  function applySelection() {
    const m = modelAt(route.model);
    const sel = selectionFor(m);
    if (!m || !sel) return;
    if (sel.effort && m.effort) m.effort.default = sel.effort;
    if (sel.context) {
      const opt = (m.contextOptions || []).find((o) => o.id === sel.context);
      if (opt) m.contextWindow = Number(opt.value);
    }
    if (sel.fast) m.fast = true;
    markDirty();
    renderBody();
    toast('Cursor\'s current selection is now the config default.', 'good', 'Default updated');
  }
  function applyLiveSelection() {
    const el = document.getElementById('live-sel');
    if (el && route.view === 'models' && route.model !== null) {
      const m = modelAt(route.model);
      if (m) el.innerHTML = liveSelectionMarkup(m);
    }
  }
  function contextLabel(m) {
    if (!m) return '—';
    const sel = selectionFor(m);
    if (sel && sel.context) {
      const opt = (m.contextOptions || []).find((o) => o.id === sel.context);
      return opt ? (opt.label || fmtTokens(opt.value)) : sel.context;
    }
    return fmtTokens(m.contextWindow) || '—';
  }

  /* ---------------- overview ---------------- */
  const USAGE_COLORS = ['#2563eb', '#0f8a49', '#b7791f', '#7c3aed', '#c0392b', '#0891b2', '#4b5563'];
  const NAME_ACRONYMS = new Set(['gpt', 'oss', 'glm', 'ai', 'api', 'tts', 'stt', 'ui', 'id', 'llm', 'vl', 'vl']);
  function prettyModelName(value) {
    return String(value || '')
      .split(/[-_:\s]+/)
      .filter(Boolean)
      .map((part) => {
        const lower = part.toLowerCase();
        if (NAME_ACRONYMS.has(lower)) return lower.toUpperCase();
        if (/^\d+[a-z]?$/.test(part)) return part.toUpperCase();
        return part.charAt(0).toUpperCase() + part.slice(1);
      })
      .join(' ');
  }
  function effectiveCursorId(m) {
    if (!m) return '';
    if (m.cursorId) return m.cursorId;
    const live = (STATUS && STATUS.models) || [];
    const match = live.find((x) => x.id === m.id);
    return (match && match.cursorId) || '';
  }
  function modelForId(id) {
    const direct = (CFG.models || []).find((m) => m.cursorId === id || m.id === id);
    if (direct) return direct;
    const live = (STATUS && STATUS.models || []).find((m) => m.cursorId === id || m.id === id);
    if (live) {
      const configured = (CFG.models || []).find((m) => m.id === live.id);
      if (configured) return configured;
      return live;
    }
    return null;
  }
  function modelName(id) {
    const model = modelForId(id);
    return model ? (model.displayName || model.id) : String(id).replace(/^claude-anycursor-/, '');
  }
  function usageColor(model, index) {
    const slug = model ? brandFor([model.id, model.model, model.vendor, model.displayName].join(' ')) : null;
    if (slug && BRANDS[slug]) return BRANDS[slug].c;
    return USAGE_COLORS[index % USAGE_COLORS.length];
  }
  function usagePanel() {
    const u = (STATUS && STATUS.usage) || { total: { requests: 0, tokensIn: 0, tokensOut: 0 }, models: [] };
    const total = u.total.requests || 0;
    if (!total) {
      return `<div class="panel usage-panel"><div class="panel-head"><h2>Usage</h2></div>
        <div class="panel-body"><div class="usage-empty">No requests yet.<br>Send one from Cursor and it shows up here.</div></div></div>`;
    }
    const C = 2 * Math.PI * 54;
    const BOX = 208;
    const RING = (54 / 140) * 168 + 18;
    const rows = u.models.map((entry, index) => {
      const model = modelForId(entry.id) || { id: modelName(entry.id), displayName: modelName(entry.id) };
      return { entry, model, color: usageColor(model, index), share: entry.requests / total };
    });

    let offset = 0;
    const arcs = rows.map(({ entry, share, color }) => {
      const len = Math.max(0, share * C - 1.5);
      const arc = `<circle cx="70" cy="70" r="54" stroke="${color}"
        stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-offset}" stroke-linecap="butt"></circle>`;
      offset += share * C;
      return arc;
    }).join('');

    let walked = 0;
    const marks = rows.map(({ model, share }) => {
      const angle = -Math.PI / 2 + (walked + share / 2) * 2 * Math.PI;
      walked += share;
      const x = BOX / 2 + RING * Math.cos(angle);
      const y = BOX / 2 + RING * Math.sin(angle);
      return `<span class="donut-mark" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px">${modelIcon(model)}</span>`;
    }).join('');

    const legend = rows.map(({ entry, model }) => {
      const share = Math.round((entry.requests / total) * 100);
      const tokens = entry.tokensIn + entry.tokensOut;
      return `<div class="lg-row"><span class="lg-ico">${modelIcon(model)}</span>
          <span class="nm">${esc(model.displayName || model.id)}</span>
          <span class="pc">${share}%</span></div>
        <div class="lg-meta">${entry.requests} request${entry.requests === 1 ? '' : 's'} · ${tokens ? fmtTokens(tokens) + ' tokens' : 'tokens n/a'}</div>`;
    }).join('');

    return `<div class="panel usage-panel">
      <div class="panel-head"><h2>Usage</h2><span class="spacer"></span><span class="sub">since start</span></div>
      <div class="panel-body">
        <div class="donut-wrap">
          <svg class="donut" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="54" stroke="#f1f3f6"></circle>
            ${arcs}
          </svg>
          <div class="donut-center"><b>${total}</b><span>request${total === 1 ? '' : 's'}</span></div>
          ${marks}
        </div>
        <div class="legend">${legend}</div>
      </div>
    </div>`;
  }

  function renderOverview() {
    const providers = Object.keys(CFG.providers || {});
    const models = CFG.models || [];
    const s = STATUS || {};
    const enabled = models.filter((m) => m.enabled !== false).length;
    const warnings = (META && META.warnings) || [];
    const primary = providers[0];
    const routed = primary ? models.filter((m) => m.provider === primary).length : 0;

    const summary = `<div class="summary">
      <div class="stat"><div class="k">Models routed</div><div class="v">${models.length}</div><div class="f">${enabled} enabled · ${models.length - enabled} off</div></div>
      <div class="stat"><div class="k">Providers</div><div class="v">${providers.length}</div><div class="f">${providers.length ? 'credentials stored locally' : 'none configured'}</div></div>
      <div class="stat"><div class="k">Uptime</div><div class="v" data-uptime>${fmtUptime(uptimeNow())}</div><div class="f">${s.routing && s.routing.nativePassthrough ? 'native passthrough on' : 'passthrough off'}</div></div>
      <div class="flow-wrap">
        <div class="flow">
          <div class="node"><div class="k">Editor</div><div class="v">Cursor</div></div>
          <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
          <div class="node hot"><div class="k">Local gateway</div><div class="v mono">${esc((s.gateway && `${s.gateway.host}:${s.gateway.port}`) || 'not running')}</div></div>
          <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
          <div class="node"><div class="k">Provider</div><div class="v">${esc(primary || 'none')}</div></div>
        </div>
      </div>
    </div>`;

    const modelRows = models.map((m, i) => {
      const caps = [];
      if (m.capabilities && m.capabilities.tools) caps.push('tools');
      if (m.capabilities && m.capabilities.vision) caps.push('vision');
      if (m.capabilities && m.capabilities.reasoning) caps.push('reasoning');
      return `<tr onclick="go('models', { model: ${i} })"
          data-search="${attr([m.displayName, m.id, m.provider, m.model].filter(Boolean).join(' ').toLowerCase())}"
          data-type="${attr(m.provider || '')}" data-state="${m.enabled === false ? 'warn' : 'ok'}">
        <td><div class="cell">${modelIcon(m)}
          <div class="grow"><div class="name">${esc(m.displayName || m.id || 'model')}</div><div class="meta mono">${esc(m.model || '')}</div></div></div></td>
        <td class="muted hide-sm">${esc(m.provider || '')}</td>
        <td class="hide-sm">${caps.map((c) => `<span class="tag">${c}</span>`).join(' ') || '<span class="muted">—</span>'}</td>
        <td class="hide-sm num">${contextLabel(m)}</td>
        <td><span class="status"><span class="dot ${m.enabled === false ? 'warn' : 'ok'}"></span>${m.enabled === false ? 'Disabled' : 'Enabled'}</span></td>
        <td class="chev-cell"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></td>
      </tr>`;
    }).join('');

    const providerRows = providers.map((name) => {
      const p = CFG.providers[name] || {};
      const has = p.hasApiKey || p.hasSecretAccessKey;
      const state = has ? 'ok' : p.credential ? 'warn' : 'bad';
      const count = models.filter((m) => m.provider === name).length;
      return `<tr onclick="go('providers', { provider: this.dataset.name })" data-name="${attr(name)}"
          data-search="${attr((name + ' ' + (p.type || '') + ' ' + (p.baseUrl || '')).toLowerCase())}"
          data-type="${attr(p.type || '')}" data-state="${state}">
        <td><div class="cell">${providerIcon(name, p)}
          <div class="grow"><div class="name">${esc(name)}</div></div></div></td>
        <td class="hide-sm muted nowrap">${esc(p.type || 'unset')}</td>
        <td class="hide-sm mono muted truncate" title="${attr(p.baseUrl || '')}">${esc(p.baseUrl || '—')}</td>
        <td class="num">${count}</td>
        <td><span class="status"><span class="dot ${state}"></span>${has ? 'Stored' : p.credential ? 'Credential' : 'Missing'}</span></td>
        <td class="chev-cell"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></td>
      </tr>`;
    }).join('');

    if (!providers.length && !models.length) {
      $('page-body').innerHTML = `${summary}
        <div class="onboard">
          <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8.2 18h4.3a3 3 0 0 0 3-3V8.2"/></svg></div>
          <h2>Nothing routed yet</h2>
          <p>AnyCursor sits between Cursor and your provider. Add a provider with your endpoint and key, then add the models you want to see in Cursor's picker.</p>
          <div class="steps">
            <span class="step"><b>1</b> Add a provider</span>
            <span class="step"><b>2</b> Add a model</span>
            <span class="step"><b>3</b> Pick it in Cursor</span>
          </div>
          <div style="margin-top:20px"><button class="pill primary" onclick="addProvider()">Add your first provider</button></div>
        </div>`;
      return;
    }

    $('page-body').innerHTML = `${summary}
      <div class="overview">
        <div class="overview-main">
          <div class="table-title"><h2>Models</h2><span class="count">${models.length}</span><span class="spacer"></span><button class="link" onclick="go('models')">Open models</button></div>
          <table class="table">
            <thead><tr><th style="width:220px">Model</th><th class="hide-sm" style="width:150px">Provider</th><th class="hide-sm">Capabilities</th><th class="hide-sm num" style="width:90px">Context</th><th style="width:110px">Status</th><th style="width:34px"></th></tr></thead>
            <tbody>${modelRows || '<tr><td colspan="6"><div class="empty"><strong>No models yet</strong>Your provider is ready — add a model to expose it in Cursor&#39;s picker.<div style="margin-top:14px"><button class="pill" onclick="addModel()">+ Add model</button></div></div></td></tr>'}</tbody>
          </table>
          <div class="table-title"><h2>Providers</h2><span class="count">${providers.length}</span><span class="spacer"></span><button class="link" onclick="go('providers')">Open providers</button></div>
          <table class="table">
            <thead><tr><th style="width:220px">Provider</th><th class="hide-sm" style="width:150px">Type</th><th class="hide-sm">Endpoint</th><th class="num" style="width:90px">Models</th><th style="width:110px">Credentials</th><th style="width:34px"></th></tr></thead>
            <tbody>${providerRows || '<tr><td colspan="6"><div class="empty"><strong>No providers yet</strong>Add one to start routing your own models.</div></td></tr>'}</tbody>
          </table>
        </div>
        <aside class="overview-rail">${usagePanel()}</aside>
      </div>
      ${warnings.length ? `<ul class="warnings">${warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}`;
    filterRows();
  }

  /* ---------------- providers ---------------- */
  function providerNames() { return Object.keys(CFG.providers || {}); }

  function setProvider(name, key, value) {
    const provider = CFG.providers[name];
    if (!provider) return;
    if (key === 'clearApiKey' || key === 'clearSecretAccessKey' || key === 'clearSessionToken') {
      provider[key] = !!value;
      if (value) provider[key.replace('clear', '').replace(/^./, (c) => c.toLowerCase())] = '';
      return;
    }
    if (value) {
      if (key === 'apiKey') provider.clearApiKey = false;
      if (key === 'secretAccessKey') provider.clearSecretAccessKey = false;
      if (key === 'sessionToken') provider.clearSessionToken = false;
    }
    provider[key] = value;
    markDirty();
  }
  function setProviderType(name, type) {
    CFG.providers[name].type = type;
    markDirty();
    render();
  }
  function addProvider() {
    const base = 'provider';
    let name = base;
    let n = 2;
    while (CFG.providers[name]) name = `${base}-${n++}`;
    CFG.providers[name] = { type: 'openai-compatible', baseUrl: '', apiKey: '' };
    markDirty();
    go('providers', { provider: name });
    const nameInput = document.querySelector('.row input[type=text]');
    if (nameInput) { nameInput.focus(); nameInput.select(); }
  }
  function renameProvider(oldName, value) {
    const next = String(value || '').trim();
    if (!next || next === oldName) { renderBody(); return; }
    if (CFG.providers[next]) {
      toast('Another provider already uses that name.', 'bad', 'Name taken');
      renderBody();
      return;
    }
    const provider = CFG.providers[oldName];
    if (!provider) return;
    const rebuilt = {};
    for (const [key, val] of Object.entries(CFG.providers)) rebuilt[key === oldName ? next : key] = val;
    CFG.providers = rebuilt;
    for (const model of CFG.models || []) if (model.provider === oldName) model.provider = next;
    route.provider = next;
    markDirty();
    render();
    toast(`Providers and models now use "${esc(next)}".`, 'good', 'Renamed');
  }

  function removeProvider(name) {
    const used = (CFG.models || []).filter((m) => m.provider === name);
    if (used.length) {
      toast('Point those models at another provider first.', 'bad', `"${esc(name)}" is used by ${used.length} model${used.length === 1 ? '' : 's'}`);
      return;
    }
    if (!confirm(`Remove provider "${name}"?`)) return;
    delete CFG.providers[name];
    markDirty();
    go('providers');
  }

  function renderProviderList() {
    const names = providerNames();
    if (!names.length) {
      $('page-body').innerHTML = '<div class="empty"><strong>No providers yet</strong>Add one to start routing models through your own endpoint.</div>';
      return;
    }
    const rows = names.map((name) => {
      const p = CFG.providers[name] || {};
      const count = (CFG.models || []).filter((m) => m.provider === name).length;
      const has = p.hasApiKey || p.hasSecretAccessKey;
      const state = has ? 'ok' : p.credential ? 'warn' : 'bad';
      return `<tr onclick="go('providers', { provider: this.dataset.name })" data-name="${attr(name)}"
          data-search="${attr((name + ' ' + (p.type || '') + ' ' + (p.baseUrl || '')).toLowerCase())}"
          data-type="${attr(p.type || '')}" data-state="${state}">
        <td><div class="cell">${providerIcon(name, p)}
          <div class="grow"><div class="name">${esc(name)}</div></div></div></td>
        <td class="muted nowrap">${esc(p.type || 'unset')}</td>
        <td class="mono muted truncate hide-sm" title="${attr(p.baseUrl || '')}">${esc(p.baseUrl || '—')}</td>
        <td class="num">${count}</td>
        <td><span class="status"><span class="dot ${state}"></span>${has ? 'Stored' : p.credential ? 'Credential' : 'Missing'}</span></td>
        <td class="chev-cell"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></td>
      </tr>`;
    }).join('');
    $('page-body').innerHTML = `<table class="table">
      <thead><tr><th style="width:300px">Provider</th><th style="width:170px">Type</th><th class="hide-sm">Endpoint</th><th class="num" style="width:96px">Models</th><th style="width:120px">Credentials</th><th style="width:34px"></th></tr></thead>
      <tbody>${rows}</tbody></table>`;
    filterRows();
  }

  function renderProviderDetail() {
    if (!CATALOG_PROVIDERS) ensureCatalog();
    const name = route.provider;
    const p = CFG.providers[name] || {};
    const isBedrock = p.type === 'bedrock';
    const isAzure = p.type === 'azure-openai';
    const typeOptions = TYPES.map((t) => `<option value="${t}" ${p.type === t ? 'selected' : ''}>${t}</option>`).join('');
    const used = (CFG.models || []).filter((m) => m.provider === name);

    const form = `<div class="panel"><div class="panel-body">
      <div class="section">
        <div class="section-title"><h3>Connection</h3><p>Where requests for this provider's models are sent.</p></div>
        ${row('Name', 'Used to reference this provider in models.', `<input type="text" value="${attr(name)}" onchange="renameProvider(route.provider, this.value)">`)}
        ${row('Type', 'Request and response protocol.', select(TYPES.map((t) => ({ value: t, label: t })), p.type, (v) => setProviderType(route.provider, v)))}
        ${row('Base URL', 'Root of the API, without the endpoint path.', textInput(p.baseUrl || '', `setProvider(route.provider, 'baseUrl', this.value)`, { placeholder: 'https://api.example.com/v1' }))}
        ${row('Endpoint path', 'Appended to the base URL for chat requests.', textInput(p.endpoint || '', `setProvider(route.provider, 'endpoint', this.value)`, { placeholder: '/chat/completions' }))}
        ${isAzure ? row('Deployment', 'Azure deployment name.', textInput(p.deployment || '', `setProvider(route.provider, 'deployment', this.value)`)) : ''}
        ${isAzure ? row('API version', 'Sent as api-version on every request.', textInput(p.apiVersion || '', `setProvider(route.provider, 'apiVersion', this.value)`)) : ''}
      </div>
      <div class="section">
        <div class="section-title"><h3>Credentials</h3><p>Stored in Windows Credential Manager, never sent to the browser.</p></div>
        ${row('API key', p.hasApiKey ? 'A key is stored. Leave blank to keep it.' : 'Not set.', `<input type="password" autocomplete="off" value="" placeholder="${p.hasApiKey ? '•••••••••••• stored' : 'Not set'}" oninput="setProvider(route.provider, 'apiKey', this.value)">${p.hasApiKey ? check('Clear the stored key', false, `setProvider(route.provider, 'clearApiKey', this.checked)`) : ''}`)}
        ${isBedrock ? row('Region', 'AWS region for the Bedrock runtime.', textInput(p.region || '', `setProvider(route.provider, 'region', this.value)`, { placeholder: 'us-east-1' })) : ''}
        ${isBedrock ? row('Access key id', 'AWS access key id.', textInput(p.accessKeyId || '', `setProvider(route.provider, 'accessKeyId', this.value)`)) : ''}
        ${isBedrock ? row('Secret access key', p.hasSecretAccessKey ? 'Stored. Leave blank to keep it.' : 'Not set.', `<input type="password" autocomplete="off" value="" placeholder="${p.hasSecretAccessKey ? '•••••••••••• stored' : 'Not set'}" oninput="setProvider(route.provider, 'secretAccessKey', this.value)">`) : ''}
        ${isBedrock ? row('Session token', 'Optional, for temporary credentials.', `<input type="password" autocomplete="off" value="" placeholder="${p.hasSessionToken ? '•••••••••••• stored' : 'Optional'}" oninput="setProvider(route.provider, 'sessionToken', this.value)">${p.hasSecretAccessKey || p.hasSessionToken ? check('Clear the stored secret and session token', false, `setProvider(route.provider, 'clearSecretAccessKey', this.checked);setProvider(route.provider, 'clearSessionToken', this.checked)`) : ''}`) : ''}
        ${row('Credential source', 'Reuse a local integration credential when no key is set.', textInput(p.credential || '', `setProvider(route.provider, 'credential', this.value)`, { placeholder: 'opencode-go' }))}
      </div>
      <div class="section">
        <div class="section-title"><h3>Metadata</h3><p>Used by model discovery and provider-specific headers.</p></div>
        ${row('Model catalogue', 'Used to look up limits and capabilities. Auto-detect reads it from your endpoint.',
          `<div class="field-inline">${select(catalogOptions(p.modelsDevProvider), p.modelsDevProvider || '', (v) => setProvider(route.provider, 'modelsDevProvider', v))}</div>
           <div class="lookup-note">${p.modelsDevProvider ? 'Pinned to this catalogue provider.' : 'Recommended: leave on auto-detect.'}</div>`)}
        ${row('API version header', 'Version header sent on every request.', textInput(p.version || '', `setProvider(route.provider, 'version', this.value)`, { placeholder: '2023-06-01' }))}
      </div>
    </div></div>`;

    const meta = `<div class="meta">
      <div class="meta-item"><div class="k">Status</div><div class="v"><span class="status"><span class="dot ${p.hasApiKey || p.hasSecretAccessKey ? 'ok' : p.credential ? 'warn' : 'bad'}"></span>${p.hasApiKey || p.hasSecretAccessKey ? 'Credentials stored' : p.credential ? 'Credential' : 'Missing'}</span></div></div>
      <div class="meta-item"><div class="k">Endpoint</div><div class="v mono">${esc(p.baseUrl || '—')}</div></div>
      <div class="meta-item"><div class="k">Models</div><div class="v">${used.length ? used.map((m) => esc(m.displayName || m.id)).join('<br>') : '<span class="muted">None</span>'}</div></div>
    </div>`;

    $('page-body').innerHTML = `<div class="detail"><div>${form}</div>${meta}</div>`;
  }

  /* ---------------- models ---------------- */
  function modelAt(index) { return (CFG.models || [])[index]; }
  function setModel(index, key, value) {
    const m = modelAt(index);
    if (!m) return;
    m[key] = value;
    markDirty();
  }
  function setModelNumber(index, key, value) {
    const m = modelAt(index);
    if (!m) return;
    const n = Number(value);
    if (value === '' || Number.isNaN(n)) delete m[key];
    else m[key] = n;
    markDirty();
  }
  function setCapability(index, key, value) {
    const m = modelAt(index);
    if (!m) return;
    m.capabilities = m.capabilities || {};
    m.capabilities[key] = !!value;
    markDirty();
  }
  function tierLabel(id) { return id ? id.charAt(0).toUpperCase() + id.slice(1) : id; }
  function setEffortDefault(index, value) {
    const m = modelAt(index);
    if (!m.effort) return;
    m.effort.default = value;
    markDirty();
    renderBody();
  }
  function addTier(index, input) {
    const raw = String(input.value || '').trim();
    if (!raw) return;
    const [idPart, ...rest] = raw.split(':');
    const id = idPart.trim();
    if (!id) return;
    const m = modelAt(index);
    m.effort = m.effort || { tiers: [], default: id, requestField: 'reasoning_effort' };
    if (!m.effort.tiers.some((t) => t.id === id)) {
      m.effort.tiers.push({ id, label: rest.join(':').trim() || tierLabel(id), value: id });
    }
    if (!m.effort.default) m.effort.default = id;
    markDirty();
    renderBody();
    focusChip('tier-input-' + index);
  }
  function removeTier(index, tierIndex) {
    const m = modelAt(index);
    if (!m.effort) return;
    m.effort.tiers.splice(tierIndex, 1);
    if (!m.effort.tiers.length) delete m.effort;
    else if (!m.effort.tiers.some((t) => t.id === m.effort.default)) m.effort.default = m.effort.tiers[0].id;
    markDirty();
    renderBody();
  }
  function addContext(index, input) {
    const raw = String(input.value || '').trim();
    if (!raw) return;
    const [idPart, valuePart] = raw.split(':');
    const id = idPart.trim();
    let value = Number(String(valuePart || '').replace(/[^0-9]/g, ''));
    if (!value) value = parseSize(id);
    if (!id || !value) return;
    const m = modelAt(index);
    m.contextOptions = m.contextOptions || [];
    if (!m.contextOptions.some((o) => o.id === id)) {
      m.contextOptions.push({ id, label: id.toUpperCase(), value });
    }
    m.contextOptions.sort((a, b) => a.value - b.value);
    markDirty();
    renderBody();
    focusChip('ctx-input-' + index);
  }
  function removeContext(index, optionIndex) {
    const m = modelAt(index);
    if (!m.contextOptions) return;
    m.contextOptions.splice(optionIndex, 1);
    if (!m.contextOptions.length) delete m.contextOptions;
    markDirty();
    renderBody();
  }
  function parseSize(text) {
    const m = String(text || '').trim().toLowerCase().match(/^([0-9.]+)\s*([km])?$/);
    if (!m) return 0;
    const n = Number(m[1]);
    if (!n) return 0;
    if (m[2] === 'm') return Math.round(n * 1000000);
    if (m[2] === 'k') return Math.round(n * 1000);
    return Math.round(n);
  }
  function setContextDefault(index, value) {
    const m = modelAt(index);
    m.contextWindow = Number(value);
    markDirty();
    renderBody();
  }
  function contextControl(m, index) {
    const opts = (m.contextOptions || []).slice().sort((a, b) => a.value - b.value);
    const current = Number(m.contextWindow) || 0;
    if (!opts.length) {
      return `<input type="number" value="${m.contextWindow ?? ''}" oninput="setModelNumber(${index}, 'contextWindow', this.value)">`;
    }
    const known = opts.some((o) => Number(o.value) === current);
    const items = opts.map((o) => ({ value: o.value, label: o.label || fmtTokens(o.value) }));
    if (!known && current) items.push({ value: current, label: fmtTokens(current) });
    items.sort((a, b) => Number(a.value) - Number(b.value));
    return `<div class="seg">${items.map((it) => `<button class="seg-btn${Number(it.value) === current ? ' on' : ''}" onclick="setContextDefault(${index}, ${Number(it.value)})">${esc(it.label)}</button>`).join('')}</div>`;
  }
  function setEffortField(index, value) {
    const m = modelAt(index);
    if (!m.effort) return;
    m.effort.requestField = value;
    markDirty();
  }
  function setLegacyIds(index, text) {
    const m = modelAt(index);
    const ids = String(text).split(',').map((s) => s.trim()).filter(Boolean);
    if (ids.length) m.legacyIds = ids; else delete m.legacyIds;
    markDirty();
  }
  function addModel() {
    const provider = providerNames()[0];
    if (!provider) { toast('Add a provider before adding models.', 'bad', 'No provider'); return; }
    const used = new Set((CFG.models || []).map((m) => m.id));
    let id = 'model';
    let n = 2;
    while (used.has(id)) id = `model-${n++}`;
    CFG.models = CFG.models || [];
    CFG.models.push({
      id,
      displayName: 'New model',
      shortName: 'New model',
      providerLabel: provider,
      provider,
      model: id,
      contextWindow: 128000,
      maxOutput: 8192,
      fast: false,
      enabled: true,
      capabilities: { tools: true, vision: false, reasoning: false, streaming: true, cache: false },
    });
    markDirty();
    go('models', { model: CFG.models.length - 1 });
  }
  function removeModel(index) {
    const m = modelAt(index);
    if (!m) return;
    if (!confirm(`Remove model "${m.displayName || m.id}"?`)) return;
    CFG.models.splice(index, 1);
    markDirty();
    go('models');
  }

  function dismissedIds() {
    try { return new Set(JSON.parse(localStorage.getItem('anycursor.dismissed') || '[]')); } catch (_) { return new Set(); }
  }
  function dismissDiscovered(id) {
    const set = dismissedIds();
    set.add(String(id));
    try { localStorage.setItem('anycursor.dismissed', JSON.stringify([...set])); } catch (_) { /* ignore */ }
    renderBody();
  }
  function knownModelIds() {
    const out = new Set();
    for (const m of CFG.models || []) {
      for (const value of [m.cursorId, m.id, m.model, ...(m.legacyIds || [])]) if (value) out.add(String(value));
    }
    return out;
  }
  function discoveredModels() {
    const known = knownModelIds();
    const dismissed = dismissedIds();
    return ((STATUS && STATUS.discovered) || []).filter((entry) => !known.has(entry.id) && !dismissed.has(entry.id));
  }
  function renderDiscoveredBadge() {
    const el = document.getElementById('nav-models-alert');
    if (!el) return;
    const count = discoveredModels().length;
    el.hidden = !count;
    el.title = count ? `${count} model id${count === 1 ? '' : 's'} seen in Cursor, not configured` : '';
  }
  function discoveredPanel() {
    const items = discoveredModels();
    if (!items.length) return '';
    const rows = items.map((entry) => `<div class="discover-row">
        <span class="id" title="${attr(entry.id)}">${esc(entry.id)}</span>
        <span class="meta">${entry.requests} request${entry.requests === 1 ? '' : 's'} · ${esc(ago(entry.lastAt))}</span>
        <button class="btn" onclick="adoptModel('${attr(entry.id)}')">Add</button>
        <button class="btn ghost" onclick="dismissDiscovered('${attr(entry.id)}')">Dismiss</button>
      </div>`).join('');
    return `<div class="discover">
      <h3>Seen in Cursor</h3>
      <p>These model ids were requested through the gateway but are not configured here. Add one to route it through your provider — limits and capabilities are filled in for you.</p>
      ${rows}
    </div>`;
  }
  async function adoptModel(id) {
    const provider = providerNames()[0];
    if (!provider) { toast('Add a provider before adding models.', 'bad', 'No provider'); return; }
    const base = String(id).replace(/^claude-anycursor-/, '').replace(/[^a-z0-9.]+/gi, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'model';
    let unique = base;
    let n = 2;
    while ((CFG.models || []).some((m) => m.id === unique)) unique = `${base}-${n++}`;
    const pretty = prettyModelName(id);
    CFG.models = CFG.models || [];
    CFG.models.push({
      id: unique,
      displayName: pretty,
      shortName: pretty,
      provider,
      providerLabel: provider,
      model: id,
      contextWindow: 128000,
      maxOutput: 8192,
      fast: false,
      enabled: true,
      capabilities: { tools: true, vision: false, reasoning: false, streaming: true, cache: false },
      legacyIds: [id],
    });
    const index = CFG.models.length - 1;
    markDirty();
    go('models', { model: index });
    await lookupModel(index);
  }

  function renderModelList() {
    const models = CFG.models || [];
    if (!models.length) {
      $('page-body').innerHTML = '<div class="empty"><strong>No models yet</strong>Add one after configuring a provider.</div>';
      return;
    }
    const rows = models.map((m, index) => {
      const caps = [];
      if (m.capabilities && m.capabilities.tools) caps.push('tools');
      if (m.capabilities && m.capabilities.vision) caps.push('vision');
      if (m.capabilities && m.capabilities.reasoning) caps.push('reasoning');
      if (m.fast) caps.push('fast');
      return `<tr onclick="go('models', { model: ${index} })"
          data-search="${attr([m.displayName, m.id, m.provider, m.model].filter(Boolean).join(' ').toLowerCase())}"
          data-type="${attr(m.provider || '')}" data-state="${m.enabled === false ? 'warn' : 'ok'}">
        <td><div class="cell">${modelIcon(m)}
          <div class="grow"><div class="name">${esc(m.displayName || m.id || 'model')}</div><div class="meta mono">${esc(m.model || '')}</div></div></div></td>
        <td class="muted hide-sm">${esc(m.provider || '—')}</td>
        <td class="hide-sm">${caps.map((c) => `<span class="tag">${c}</span>`).join(' ') || '<span class="muted">—</span>'}</td>
        <td class="hide-sm muted">${contextLabel(m)}</td>
        <td><span class="status"><span class="dot ${m.enabled === false ? 'warn' : 'ok'}"></span>${m.enabled === false ? 'Disabled' : 'Enabled'}</span></td>
        <td class="chev-cell"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></td>
      </tr>`;
    }).join('');
    $('page-body').innerHTML = `${discoveredPanel()}<table class="table">
      <thead><tr><th style="width:300px">Model</th><th class="hide-sm" style="width:150px">Provider</th><th class="hide-sm">Capabilities</th><th class="hide-sm num" style="width:96px">Context</th><th style="width:120px">Status</th><th style="width:34px"></th></tr></thead>
      <tbody>${rows}</tbody></table>`;
    filterRows();
  }

  let CATALOG_PROVIDERS = null;
  async function ensureCatalog() {
    if (CATALOG_PROVIDERS) return;
    CATALOG_PROVIDERS = [];
    try {
      const res = await fetch('/api/models-dev/providers');
      const data = await res.json();
      CATALOG_PROVIDERS = data.ok ? data.providers : [];
    } catch (_) { CATALOG_PROVIDERS = []; }
    // A stale id from an older discovery run is not worth preserving: the
    // endpoint detection handles it, so drop it instead of showing junk.
    const current = route.provider && CFG.providers ? CFG.providers[route.provider] : null;
    if (current && current.modelsDevProvider && !CATALOG_PROVIDERS.some((x) => x.id === current.modelsDevProvider)) {
      delete current.modelsDevProvider;
      markDirty();
    }
    if (route.view === 'providers' && route.provider) renderBody();
  }
  function catalogOptions(current) {
    const opts = [{ value: '', label: 'Auto-detect from endpoint' }];
    for (const provider of CATALOG_PROVIDERS || []) {
      opts.push({ value: provider.id, label: provider.name && provider.name !== provider.id ? provider.name : provider.id });
    }
    if (current && !opts.some((o) => o.value === current)) {
      opts.push({ value: current, label: `${current} (not in catalogue)` });
    }
    return opts;
  }

  const lookup = {};
  function lookupNote(index) {
    const state = lookup[index];
    if (!state) return '';
    if (state.state === 'loading') return '<div class="lookup-note">Checking models.dev…</div>';
    if (state.state === 'ok') return `<div class="lookup-note ok">Matched ${esc(state.name)}${state.providerId ? ` (${esc(state.providerId)})` : ''} on models.dev</div>`;
    if (state.state === 'missing') return '<div class="lookup-note">No entry for this id — set the fields manually.</div>';
    if (state.state === 'error') return `<div class="lookup-note">Lookup failed: ${esc(state.error)}</div>`;
    return '';
  }
  function applyModelMeta(index, meta) {
    const m = modelAt(index);
    if (!m) return;
    if (meta.name) {
      const pretty = prettyModelName(meta.name);
      if (!m.displayName || m.displayName === 'New model' || m.displayName === m.model) m.displayName = pretty;
      if (!m.shortName || m.shortName === 'New model' || m.shortName === m.model) m.shortName = pretty;
    }
    if (meta.contextWindow) m.contextWindow = meta.contextWindow;
    if (meta.maxOutput) m.maxOutput = meta.maxOutput;
    if (meta.capabilities) m.capabilities = { ...(m.capabilities || {}), ...meta.capabilities };
    if (meta.effortTiers && meta.effortTiers.length) {
      m.effort = {
        tiers: meta.effortTiers,
        default: (m.effort && m.effort.default) || meta.effortDefault || meta.effortTiers[0].id,
        requestField: (m.effort && m.effort.requestField) || 'reasoning_effort',
      };
    } else if (meta.capabilities && meta.capabilities.reasoning === false) {
      delete m.effort;
    }
  }
  async function lookupModel(index) {
    const m = modelAt(index);
    if (!m) return;
    const modelId = String(m.model || m.id || '').trim();
    if (!modelId) { toast('Add the real model id first.', 'bad', 'Nothing to look up'); return; }
    lookup[index] = { state: 'loading' };
    renderBody();
    try {
      const res = await fetch('/api/lookup-model', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ provider: m.provider || '', model: modelId }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'lookup failed');
      if (!data.found) {
        lookup[index] = { state: 'missing' };
        renderBody();
        toast('models.dev has no entry for this model id.', 'bad', 'Not found');
        return;
      }
      applyModelMeta(index, data.meta);
      lookup[index] = { state: 'ok', name: data.meta.name || modelId, providerId: data.providerId || '' };
      markDirty();
      renderBody();
      await saveConfig();
      toast('Limits, reasoning and capabilities loaded from models.dev.', 'good', 'Auto-filled and saved');
    } catch (error) {
      lookup[index] = { state: 'error', error: String((error && error.message) || error) };
      renderBody();
      toast(esc(String((error && error.message) || error)), 'bad', 'Lookup failed');
    }
  }

  function renderModelDetail() {
    const index = route.model;
    const idx = index;
    const m = modelAt(index);
    if (!m) { go('models'); return; }
    const effort = m.effort || null;
    const caps = m.capabilities || {};

    const form = `<div class="panel"><div class="panel-body">
      <div class="section">
        <div class="section-title"><h3>Identity</h3><p>How the model appears in Cursor's picker.</p></div>
        ${row('Display name', 'Shown in the model picker.', textInput(m.displayName || '', `setModel(${index}, 'displayName', this.value)`))}
        ${row('Model id', 'Internal slug for this entry.', textInput(m.id || '', `setModel(${index}, 'id', this.value)`, { placeholder: 'deepseek-v4.1-flash' }))}
        ${row('Short name', 'Compact label used in tight UI.', textInput(m.shortName || '', `setModel(${index}, 'shortName', this.value)`))}
        ${row('Vendor', 'Shown under the model name.', textInput(m.vendor || '', `setModel(${index}, 'vendor', this.value)`))}
        ${row('Provider label', 'Display label for the provider.', textInput(m.providerLabel || '', `setModel(${index}, 'providerLabel', this.value)`))}
      </div>
      <div class="section">
        <div class="section-title"><h3>Routing</h3><p>Where this model's requests are actually sent.</p></div>
        ${row('Provider', 'Holds the credentials for this model.', select(providerNames().map((n) => ({ value: n, label: n })), m.provider, (v) => setModel(idx, 'provider', v)))}
        ${row('Real model id', 'Sent to the provider unchanged. Blur to look it up.', `<div class="field-inline">
          <input type="text" value="${attr(m.model || '')}" oninput="setModel(${index}, 'model', this.value)" onchange="lookupModel(${index})">
          <button class="btn" onclick="lookupModel(${index})">${lookup[index] && lookup[index].state === 'loading' ? 'Looking up…' : 'Look up'}</button>
        </div>${lookupNote(index)}`)}
        ${row('Legacy ids', 'Older ids that still resolve here.', textInput((m.legacyIds || []).join(', '), `setLegacyIds(${index}, this.value)`, { placeholder: 'old-id, another-id' }))}
      </div>
      <div class="section">
        <div class="section-title"><h3>Limits</h3><p>Advertised to Cursor so it budgets the conversation.</p></div>
        ${lookup[index] && lookup[index].state === 'ok'
          ? '<div class="lookup-note" style="padding:0 0 10px">Values from models.dev. If your endpoint allows a larger window, add it under Context sizes.</div>'
          : ''}
        ${row('Context window', 'What Cursor budgets by default.', contextControl(m, index))}
        ${row('Context sizes', 'Also offered in the picker.', `<div class="chips" onclick="this.querySelector('input').focus()">
          ${(m.contextOptions || []).map((o, i) => `<span class="chip-item" title="${attr(Number(o.value).toLocaleString())} tokens"><b>${esc(o.label || fmtTokens(o.value))}</b><button type="button" title="Remove" onclick="event.stopPropagation();removeContext(${index}, ${i})">×</button></span>`).join('')}
          <input class="chip-input" id="ctx-input-${index}" placeholder="${(m.contextOptions || []).length ? 'Add size…' : '1m:1000000'}" onkeydown="if(event.key==='Enter'){event.preventDefault();addContext(${index}, this)}">
        </div>`)}
        ${row('Max output', 'Largest response allowed.', `<input type="number" value="${m.maxOutput ?? ''}" oninput="setModelNumber(${index}, 'maxOutput', this.value)">`)}
      </div>
      <div class="section">
        <div class="section-title"><h3>Reasoning</h3><p>Optional effort tiers exposed in the picker.</p></div>
        ${(m.capabilities && m.capabilities.reasoning && !(effort && effort.tiers.length))
          ? '<div class="lookup-note" style="padding:0 0 10px">This model exposes reasoning as an on/off toggle, not effort levels — Cursor shows its Thinking switch. Nothing to configure here.</div>'
          : ''}
        ${row('Effort tiers', 'Picker levels.', `<div class="chips" onclick="this.querySelector('input').focus()">
          ${(effort ? effort.tiers : []).map((t, i) => `<span class="chip-item"><b>${esc(t.label || t.id)}</b><button type="button" title="Remove" onclick="event.stopPropagation();removeTier(${index}, ${i})">×</button></span>`).join('')}
          <input class="chip-input" id="tier-input-${index}" placeholder="${effort && effort.tiers.length ? 'Add tier…' : 'low:Low'}" onkeydown="if(event.key==='Enter'){event.preventDefault();addTier(${index}, this)}">
        </div>`)}
        ${row('Default effort', 'Selected when the picker opens.', effort && effort.tiers.length
          ? `<div class="seg">${effort.tiers.map((t) => `<button class="seg-btn${t.id === effort.default ? ' on' : ''}" onclick="setEffortDefault(${index}, '${attr(t.id)}')">${esc(t.label || t.id)}</button>`).join('')}</div>`
          : '<span class="muted" style="font-size:13px">Add a tier first.</span>')}
        ${row('Request field', 'Body field carrying the effort value.', textInput(effort ? effort.requestField || '' : '', `setEffortField(${index}, this.value)`, { placeholder: 'reasoning_effort' }))}
      </div>
      <div class="section">
        <div class="section-title"><h3>Capabilities</h3><p>Cursor hides features the model cannot handle.</p></div>
        ${row('Supported', '', `<div class="checks">
          ${check('Tools', caps.tools, `setCapability(${index}, 'tools', this.checked)`)}
          ${check('Vision', caps.vision, `setCapability(${index}, 'vision', this.checked)`)}
          ${check('Reasoning', caps.reasoning, `setCapability(${index}, 'reasoning', this.checked)`)}
          ${check('Streaming', caps.streaming !== false, `setCapability(${index}, 'streaming', this.checked)`)}
          ${check('Cache', caps.cache, `setCapability(${index}, 'cache', this.checked)`)}
        </div>`)}
        ${row('Behaviour', '', `<div class="checks">
          ${check('Fast mode', m.fast === true, `setModel(${index}, 'fast', this.checked)`)}
          ${check('Enabled', m.enabled !== false, `setModel(${index}, 'enabled', this.checked)`)}
        </div>`)}
      </div>
    </div></div>`;

    const meta = `<div class="meta">
      <div class="meta-item" id="live-sel">${liveSelectionMarkup(m)}</div>
      <div class="meta-item"><div class="k">Cursor id</div><div class="v mono">${esc(effectiveCursorId(m) || '—')}</div>${effectiveCursorId(m) ? `<button class="meta-copy" data-copy="${attr(effectiveCursorId(m))}" onclick="copyText(this)">Copy id</button>` : ''}</div>
      <div class="meta-item"><div class="k">Provider</div><div class="v">${esc(m.provider || '—')}</div></div>
      <div class="meta-item"><div class="k">Context</div><div class="v">${m.contextWindow ? fmtTokens(m.contextWindow) + ' default' : '—'}${(m.contextOptions && m.contextOptions.length && contextLabel(m) !== fmtTokens(m.contextWindow)) ? `<br><span class="muted">${contextLabel(m)} available</span>` : ''}</div></div>
      <div class="meta-item"><div class="k">Status</div><div class="v"><span class="status"><span class="dot ${m.enabled === false ? 'warn' : 'ok'}"></span>${m.enabled === false ? 'Disabled' : 'Enabled'}</span></div></div>
    </div>`;

    $('page-body').innerHTML = `<div class="detail"><div>${form}</div>${meta}</div>`;
  }

  /* ---------------- gateway ---------------- */
  function setNested(section, key, value) {
    CFG[section] = CFG[section] || {};
    if (key === 'port') {
      const n = Number(value);
      CFG[section][key] = Number.isNaN(n) ? value : n;
    } else CFG[section][key] = value;
    markDirty();
  }

  function renderGateway() {
    const g = CFG.gateway || {};
    const r = CFG.routing || {};
    const restart = META && META.restartRequired ? Object.entries(META.restartRequired).filter(([, v]) => v).map(([k]) => k) : [];

    const listener = `<div class="panel"><div class="panel-body">
      <div class="section">
        <div class="section-title"><h3>Listener</h3><p>Host and port changes need a gateway restart.</p></div>
        ${row('Host', 'Loopback only is recommended.', textInput(g.host || '127.0.0.1', `setNested('gateway', 'host', this.value)`))}
        ${row('Port', 'AnyCursor listens here for Cursor.', `<input type="number" value="${g.port ?? ''}" oninput="setNested('gateway', 'port', this.value)">`)}
        ${row('Upstream', 'Cursor backend, used for native passthrough.', textInput(g.upstream || '', `setNested('gateway', 'upstream', this.value)`, { placeholder: 'https://api2.cursor.sh' }))}
        ${row('Data directory', 'Sessions, logs and backups.', textInput(g.dataDir || '', `setNested('gateway', 'dataDir', this.value)`, { placeholder: '%LOCALAPPDATA%\\AnyCursor' }))}
      </div>
    </div></div>`;

    const routing = `<div class="panel"><div class="panel-body">
      <div class="section">
        <div class="section-title"><h3>Routing</h3><p>What happens to models AnyCursor does not know about.</p></div>
        ${row('Native passthrough', 'Forward unknown models to Cursor untouched.', check('Enabled', r.nativePassthrough !== false, `setNested('routing', 'nativePassthrough', this.checked)`))}
        ${row('Unknown model', 'Fallback when passthrough is off.', select([{ value: 'native', label: 'native' }, { value: 'error', label: 'error' }], r.onUnknownModel || 'native', (v) => setNested('routing', 'onUnknownModel', v)))}
        ${row('Default model', 'Used when a request names no model.', textInput(r.defaultModel || '', `setNested('routing', 'defaultModel', this.value)`, { placeholder: 'claude-anycursor-…' }))}
      </div>
    </div></div>`;

    const config = `<div class="panel"><div class="panel-body">
      <div class="section">
        <div class="section-title"><h3>Configuration file</h3><p>${META && META.error ? `Error: ${esc(META.error)}` : 'Changes apply to new requests immediately.'}${restart.length ? ` Restart required for: ${esc(restart.join(', '))}.` : ''}</p></div>
        ${row('Path', 'Backups are written next to it.', `<div class="mono muted" style="padding:8px 0">${esc((META && META.path) || '—')}</div><div><button class="btn" onclick="copyPath(this)">Copy path</button></div>`)}
      </div>
      ${(META && META.warnings && META.warnings.length) ? `<ul class="warnings">${META.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    </div></div>`;

    $('page-body').innerHTML = listener + routing + config;
  }

  async function copyConfig(btn) {
    const text = (META && META.path) || '';
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      btn.style.color = 'var(--green)';
      setTimeout(() => { btn.style.color = ''; }, 1200);
    } catch (_) { toast('Clipboard is blocked by the browser.', 'bad'); }
  }

  async function copyText(btn) {
    try {
      await navigator.clipboard.writeText(btn.dataset.copy || '');
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = 'Copy id'; }, 1400);
    } catch (_) { toast('Clipboard is blocked by the browser.', 'bad'); }
  }

  async function copyPath(btn) {
    const text = (META && META.path) || '';
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = 'Copy path'; }, 1400);
    } catch (_) { toast('Clipboard is blocked by the browser.', 'bad'); }
  }

  async function copyGateway(btn) {
    const s = STATUS;
    if (!s || !s.gateway) return;
    try {
      await navigator.clipboard.writeText(`http://${s.gateway.host}:${s.gateway.port}/`);
      btn.style.color = 'var(--green)';
      setTimeout(() => { btn.style.color = ''; }, 1200);
    } catch (_) { toast('Clipboard is blocked by the browser.', 'bad'); }
  }

  /* ---------------- raw ---------------- */
  function renderRaw() {
    $('page-body').innerHTML = `<div class="panel"><div class="panel-head"><h2>Configuration</h2><span class="sub">Stored secrets appear empty — leave them empty to keep the saved value.</span></div>
      <div class="panel-body" style="padding:14px 18px 18px"><textarea id="raw-json" spellcheck="false" style="min-height:62vh;resize:none;font-family:var(--mono);font-size:12.5px;line-height:1.7"></textarea></div></div>`;
    $('raw-json').value = JSON.stringify(CFG, null, 2);
  }

  function applyRaw() {
    const el = $('raw-json');
    if (!el) return;
    try {
      const parsed = JSON.parse(el.value);
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('config must be a JSON object');
      CFG = parsed;
      markDirty();
      go('providers');
      toast('The editor now matches your JSON. Save to write it to disk.', 'good', 'Applied');
    } catch (error) {
      toast(esc(error.message), 'bad', 'JSON error');
    }
  }

  /* ---------------- load / save ---------------- */
  async function loadConfig() {
    try {
      const res = await fetch('/api/config', { cache: 'no-store' });
      META = await res.json();
      CFG = META.config || {};
      markDirty(false);
      render();
      updateStatus();
      if (META.path) {
        const parts = String(META.path).split(/[\\/]/);
        $('rail-cfg').textContent = parts[parts.length - 1] || META.path;
        $('rail-cfg').title = META.path;
      }
      if (META.error) toast(esc(META.error), 'bad', 'Config error');
    } catch (error) {
      toast('Cannot reach the gateway: ' + esc(error.message), 'bad', 'Offline');
      $('page-body').innerHTML = '<div class="empty">Cannot reach the gateway.</div>';
    }
  }

  async function saveConfig() {
    if (!CFG) return;
    $('save-btn').disabled = true;
    try {
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ config: CFG }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        toast(esc(data.error || `HTTP ${res.status}`), 'bad', 'Save failed');
        return;
      }
      META = data;
      CFG = data.config || CFG;
      markDirty(false);
      const restart = Object.entries(data.restartRequired || {}).filter(([, v]) => v).map(([k]) => k);
      toast(restart.length ? `Restart required for: ${esc(restart.join(', '))}.` : 'Applied to new requests without a restart.', 'good', 'Saved');
      render();
      updateStatus();
    } catch (error) {
      toast(esc(error.message), 'bad', 'Save failed');
    } finally {
      $('save-btn').disabled = false;
    }
  }

  async function reloadConfig() {
    if (dirty && !confirm('Discard unsaved changes and reload from disk?')) return;
    try {
      const res = await fetch('/api/config/reload', { method: 'POST' });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        toast(esc(data.error || `HTTP ${res.status}`), 'bad', 'Reload failed');
        return;
      }
      META = data;
      CFG = data.config || {};
      markDirty(false);
      go(route.view);
      updateStatus();
      toast('Loaded the configuration file from disk.', 'good', 'Reloaded');
    } catch (error) {
      toast(esc(error.message), 'bad', 'Reload failed');
    }
  }

  async function updateStatus() {
    try {
      const res = await fetch('/api/status', { cache: 'no-store' });
      const s = await res.json();
      STATUS = s;
      uptimeBase = s.uptimeMs || 0;
      uptimeAt = Date.now();
      for (const entry of s.discovered || []) {
        notify(`model:${entry.id}`, 'New model detected', entry.id, entry.firstAt || entry.lastAt);
      }
      renderNotifs();
      $('top-dot').className = 'dot ' + (s.ok ? 'ok' : 'bad');
      $('top-state').textContent = s.ok ? 'Gateway ready' : 'Config error';
      if (s.version) $('rail-version') && ($('rail-version').textContent = 'v' + s.version);
      renderDiscoveredBadge();
      const key = JSON.stringify(s.selections || {});
      if (key !== lastSelections) {
        lastSelections = key;
        if (route.view === 'overview' || (route.view === 'models' && route.model === null) || (route.view === 'providers' && !route.provider)) {
          renderBody();
        }
        applyLiveSelection();
      } else if (route.view === 'overview') {
        renderBody();
      }
    } catch (_) {
      $('top-dot').className = 'dot bad';
      $('top-state').textContent = 'Offline';
    }
  }

  window.addEventListener('beforeunload', (event) => {
    if (!dirty) return;
    event.preventDefault();
    event.returnValue = '';
  });

  window.addEventListener('keydown', (event) => {
    const meta = event.ctrlKey || event.metaKey;
    if (meta && event.key.toLowerCase() === 's') { event.preventDefault(); if (CFG) saveConfig(); }
    if (meta && event.key.toLowerCase() === 'k') { event.preventDefault(); $('global-search').focus(); }
    if (event.key === 'Escape' && document.activeElement === $('global-search')) {
      $('global-search').value = ''; query = ''; renderBody(); $('global-search').blur();
    }
  });

  loadConfig();
  setInterval(updateStatus, 5000);
  setInterval(tickUptime, 1000);
</script>
</body>
</html>
